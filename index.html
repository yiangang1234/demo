<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Readuel 데모</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@700;800&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  /* 레이아웃: 폰 한 화면 앱. 모눈 노트 위에 잉크 남색, 형광펜 노랑은 보상·강조에만 */
  --paper:#f2f4f8; --card:#ffffff; --ink:#151c45; --muted:#596185; --line:#d8deec;
  --blue:#2b4fe0; --hl:#ffd93b; --good:#12895a; --bad:#d23f35; --lock:#8a90a8;
  --display:'Gothic A1','IBM Plex Sans KR','Apple SD Gothic Neo',sans-serif;
  --body:'IBM Plex Sans KR',system-ui,-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html{font-synthesis:none;text-rendering:optimizeLegibility}
html,body{height:100%;margin:0}
body{background:var(--ink);font-family:var(--body);color:var(--ink);-webkit-font-smoothing:antialiased;overflow:hidden;font-size:15px;line-height:1.55}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,summary:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
#app{position:relative;max-width:440px;height:100%;margin:0 auto;display:flex;flex-direction:column;overflow:hidden;
  background-color:var(--paper);
  background-image:linear-gradient(rgba(43,79,224,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(43,79,224,.07) 1px,transparent 1px);
  background-size:22px 22px}
@media (min-width:500px){#app{height:calc(100% - 32px);margin:16px auto;border-radius:30px;box-shadow:0 30px 80px rgba(0,0,0,.45)}}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:calc(10px + env(safe-area-inset-top)) 14px 10px;background:var(--paper);border-bottom:2px solid var(--ink)}
.logo{font-family:var(--display);font-weight:800;font-size:22px;line-height:1.2;letter-spacing:-.02em;display:flex;align-items:center;gap:5px;white-space:nowrap}
.logo small{font-family:var(--body);font-size:10px;font-weight:700;border:1.5px solid var(--ink);border-radius:5px;padding:1px 4px;line-height:1.4}
.chips{display:flex;gap:5px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:3px;font-weight:700;font-size:12.5px;padding:3px 8px;border-radius:999px;background:var(--card);border:1.5px solid var(--ink);font-variant-numeric:tabular-nums;white-space:nowrap;line-height:1.4}
.chip svg{width:14px;height:14px}
.tierchip{padding:2px;border-radius:50%;width:30px;height:30px;justify-content:center}
.tierchip svg{width:22px;height:22px}

main{flex:1;overflow-y:auto;padding:16px 16px 28px;-webkit-overflow-scrolling:touch}
.tabs{display:grid;grid-template-columns:repeat(5,1fr);border-top:2px solid var(--ink);background:var(--card);padding-bottom:env(safe-area-inset-bottom)}
.tabs button{border:0;background:none;padding:8px 0 6px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;font-weight:600;color:var(--muted);min-width:0}
.tabs button svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tabs button span{border-bottom:3px solid transparent;padding:0 1px 1px;white-space:nowrap}
.tabs button[aria-current="page"]{color:var(--ink)}
.tabs button[aria-current="page"] span{border-bottom-color:var(--hl)}

/* type */
h1,h2,h3{text-wrap:balance;margin:0}
.h1{font-family:var(--display);font-weight:800;font-size:27px;line-height:1.38;letter-spacing:-.02em}
.sec{font-family:var(--display);font-weight:800;font-size:19px;margin:26px 0 10px;display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.sec small{font-family:var(--body);font-size:12px;font-weight:500;color:var(--muted)}
/* 형광펜은 글자 아래쪽 띠로만: 글자를 덮지 않게 */
.mark{background:linear-gradient(var(--hl),var(--hl)) left bottom/100% .3em no-repeat;padding:0 .06em .08em;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.blank{display:inline-block;width:2.4em;height:1em;border-bottom:2.5px solid currentColor;vertical-align:-.1em;margin:0 .15em}
.muted{color:var(--muted)}
.tiny{font-size:12px}
.num{font-variant-numeric:tabular-nums}

/* cards */
.card{background:var(--card);border:1.5px solid var(--ink);border-radius:16px;padding:14px}
.card+.card{margin-top:10px}
.tap{display:block;width:100%;text-align:left;background:var(--card);border:1.5px solid var(--ink);border-radius:16px;padding:13px 14px;box-shadow:3px 3px 0 var(--ink);transition:transform .08s,box-shadow .08s}
.tap:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.tap.locked{border-style:dashed;box-shadow:none;background:rgba(255,255,255,.6);color:var(--muted)}
.tap.off{box-shadow:none;background:rgba(255,255,255,.7)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.list{display:grid;gap:10px}
.t-title{font-weight:700;font-size:15px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.t-sub{font-size:13px;color:var(--muted);margin-top:2px}
.t-meta{display:flex;justify-content:space-between;align-items:center;gap:6px;margin-top:8px;font-size:12px;color:var(--muted)}
.t-head{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.tro{display:inline-flex;align-items:center;gap:3px;font-weight:700;font-size:13px;color:var(--ink);white-space:nowrap;font-variant-numeric:tabular-nums}
.tro svg{width:15px;height:15px}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:1px 7px;border-radius:999px;border:1.2px solid currentColor;line-height:1.5;white-space:nowrap}
.tag.hl{background:var(--hl);border-color:var(--ink);color:var(--ink)}
.tag.lk{color:var(--lock)}
.tag.tm{color:var(--blue)}
.lockic{width:14px;height:14px;flex:none}
.feat{background:var(--ink);color:#fff;border-color:var(--ink);box-shadow:3px 3px 0 var(--hl)}
.feat .t-sub,.feat .t-meta,.feat .tro{color:#d4d8f5}
.cat .t-title{font-size:18px}
.back{display:inline-flex;align-items:center;gap:4px;border:1.5px solid var(--ink);background:var(--card);border-radius:10px;padding:5px 10px;font-weight:700;font-size:13px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1.5px solid var(--ink);border-radius:12px;padding:12px 16px;font-weight:700;background:var(--ink);color:#fff;min-height:46px}
.btn.hl{background:var(--hl);color:var(--ink);box-shadow:3px 3px 0 var(--ink)}
.btn.ghost{background:var(--card);color:var(--ink)}
.btn.sm{padding:6px 11px;min-height:34px;font-size:13px;border-radius:10px}
.btn[disabled]{background:#e7e9f1;color:var(--lock);border-color:var(--lock);border-style:dashed;box-shadow:none;cursor:not-allowed}
.btn.full{width:100%}
.row{display:flex;gap:8px;align-items:center}
.row.wrap{flex-wrap:wrap}
.spacer{flex:1}

/* bars */
.bar{height:10px;border-radius:99px;background:#e4e8f3;border:1.2px solid var(--ink);overflow:hidden}
.bar i{display:block;height:100%;background:var(--blue);border-radius:99px}
.bar.hlb i{background:var(--hl)}

/* home */
.streak{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center}
.flame{width:64px;height:64px;border-radius:18px;background:var(--hl);border:1.5px solid var(--ink);display:grid;place-items:center;position:relative}
.flame svg{width:30px;height:30px}
.flame b{position:absolute;bottom:-9px;background:var(--ink);color:#fff;font-size:11px;padding:0 6px;border-radius:99px}
.quest{display:grid;grid-template-columns:22px 1fr auto;gap:10px;align-items:center;padding:9px 0;border-top:1px dashed var(--line)}
.quest:first-of-type{border-top:0}
.ck{width:22px;height:22px;border-radius:7px;border:1.5px solid var(--ink);display:grid;place-items:center;background:#fff}
.ck.on{background:var(--good);border-color:var(--good)}
.ck.on svg{width:14px;height:14px;stroke:#fff;stroke-width:3;fill:none}
.ck.lk{border-style:dashed;border-color:var(--lock)}
.notice{border:1.5px dashed var(--ink);border-radius:14px;padding:12px 14px;font-size:13px;background:rgba(255,217,59,.25)}

/* sheet (game screens) */
.sheet{position:absolute;inset:0;background-color:var(--paper);background-image:inherit;background-size:22px 22px;z-index:20;display:none;flex-direction:column}
.sheet.open{display:flex}
.sh-head{display:flex;align-items:center;gap:12px;padding:calc(10px + env(safe-area-inset-top)) 14px 10px;border-bottom:2px solid var(--ink);background:var(--paper)}
.x{width:36px;height:36px;border-radius:10px;border:1.5px solid var(--ink);background:var(--card);display:grid;place-items:center;flex:none}
.x svg{width:16px;height:16px;stroke:var(--ink);stroke-width:2.5}
.sh-title{font-weight:700;font-size:14px;flex:0 1 auto;max-width:42%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sh-body{flex:1;overflow-y:auto;padding:16px}
.sh-foot{padding:12px 16px calc(12px + env(safe-area-inset-bottom));border-top:2px solid var(--ink);background:var(--card)}
.sh-foot:empty{display:none}
.prog{flex:1;min-width:0}
.timer{display:flex;align-items:center;gap:8px}
.timer b{font-variant-numeric:tabular-nums;min-width:30px;text-align:right;font-size:14px}
.kind{display:flex;gap:6px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
.q{font-weight:700;font-size:17px;line-height:1.5;margin:12px 0 14px}
.opts{display:grid;gap:9px}
.opt{text-align:left;border:1.5px solid var(--ink);border-radius:14px;background:var(--card);padding:12px 14px;display:grid;grid-template-columns:26px 1fr;gap:8px;align-items:start;font-size:15px}
.opt .n{width:24px;height:24px;border-radius:7px;border:1.5px solid var(--ink);display:grid;place-items:center;font-size:12px;font-weight:700}
.opt.ok{border-color:var(--good);background:#e5f6ee}
.opt.ok .n{background:var(--good);color:#fff;border-color:var(--good)}
.opt.no{border-color:var(--bad);background:#fdeceb}
.opt.no .n{background:var(--bad);color:#fff;border-color:var(--bad)}
.opt[disabled]{cursor:default}
.fb{display:grid;gap:6px;margin-bottom:10px}
.fb h3{font-family:var(--display);font-weight:800;font-size:22px}
.fb.ok h3{color:var(--good)}
.fb.no h3{color:var(--bad)}
.fb p{margin:0;font-size:14px}
.passage{background:var(--card);border:1.5px solid var(--ink);border-radius:14px;padding:16px;font-size:15.5px;line-height:1.8}
.passage p{margin:0 0 12px}
.passage p:last-child{margin:0}
details.pv{border:1.5px solid var(--ink);border-radius:12px;background:var(--card);margin-bottom:6px}
details.pv summary{padding:9px 12px;font-weight:600;font-size:13px;cursor:pointer}
details.pv .passage{border:0;border-top:1px dashed var(--line);border-radius:0 0 12px 12px;font-size:14px}

/* context blocks */
.ctx{background:var(--card);border:1.5px solid var(--ink);border-radius:14px;padding:14px;font-size:14.5px}
.ctx p{margin:0 0 8px}
.ctx p:last-child{margin:0}
.chat{display:grid;gap:7px}
.bub{max-width:82%;padding:8px 12px;border-radius:16px;font-size:14px;line-height:1.45}
.bub small{display:block;font-size:11px;font-weight:700;color:var(--muted);margin-bottom:1px}
.bub.l{justify-self:start;background:#eef1fa;border:1px solid var(--line);border-bottom-left-radius:4px}
.bub.r{justify-self:end;background:var(--hl);border:1px solid #e3be1a;border-bottom-right-radius:4px}
.sys{justify-self:center;font-size:11.5px;color:var(--muted);background:#eef1fa;border-radius:99px;padding:2px 10px}
.suspect{display:grid;grid-template-columns:38px 1fr;gap:10px;padding:10px 0;border-top:1px dashed var(--line)}
.suspect:first-child{border-top:0;padding-top:0}
.av{width:38px;height:38px;border-radius:12px;border:1.5px solid var(--ink);display:grid;place-items:center;font-weight:700;background:var(--paper)}
.suspect .note{font-size:12px;color:var(--muted)}
.exam{background:#fffdf3;border:1.5px solid var(--ink);border-radius:6px;padding:14px;font-size:14px}
.exam .stamp{display:inline-block;color:var(--bad);border:2px solid var(--bad);border-radius:6px;padding:0 8px;font-weight:700;transform:rotate(-4deg)}

/* order puzzle */
.slots{display:grid;gap:8px;min-height:60px;border:1.5px dashed var(--ink);border-radius:14px;padding:10px;background:rgba(255,255,255,.7);margin-bottom:12px}
.slots .empty{color:var(--muted);font-size:13px;text-align:center;align-self:center}
.piece{text-align:left;border:1.5px solid var(--ink);border-radius:12px;background:var(--card);padding:10px 12px;font-size:14px;display:grid;grid-template-columns:22px 1fr;gap:8px}
.piece b{font-weight:700;color:var(--blue)}
.piece.used{opacity:.35}

/* match puzzle */
.match{display:grid;grid-template-columns:1fr 1.4fr;gap:10px}
.match .col{display:grid;gap:8px;align-content:start}
.mbtn{position:relative;border:1.5px solid var(--ink);border-radius:12px;background:var(--card);padding:11px 10px;font-size:14px;text-align:left;min-height:48px}
.mbtn.sel{background:var(--hl)}
.mbtn.done{background:#e5f6ee;border-color:var(--good);color:var(--good);cursor:default}
.mbtn.bad{background:#fdeceb;border:2px solid var(--bad);color:var(--bad);animation:shake .35s}
.mbtn.bad::after{content:"✕";position:absolute;right:8px;top:50%;transform:translateY(-50%);font-weight:700}
.miss{font-size:12px;margin-top:8px;color:var(--muted)}
.miss.on{color:var(--bad);font-weight:700}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}

/* study card */
.flash{min-height:250px;display:grid;place-items:center;text-align:center;padding:24px;border:1.5px solid var(--ink);border-radius:20px;background:var(--card);box-shadow:4px 4px 0 var(--ink);width:100%}
.flash .w{font-family:var(--display);font-weight:800;font-size:32px;line-height:1.35;word-break:keep-all}
.flash .m{font-size:17px;font-weight:600;margin-top:12px}
.flash .e{font-size:14px;color:var(--muted);margin-top:10px}

/* quick */
.qbig{font-weight:700;font-size:24px;line-height:1.45;text-align:center;margin:28px 0 24px;min-height:110px;display:grid;place-items:center;word-break:keep-all}
.qopts{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.qopts button{min-height:90px;border:1.5px solid var(--ink);border-radius:18px;background:var(--card);font-size:18px;font-weight:700;box-shadow:3px 3px 0 var(--ink);word-break:keep-all;padding:8px}
.qopts button.ok{background:#bdebd6}
.qopts button.no{background:#f7c9c5}
.score{display:flex;justify-content:center;gap:18px;font-weight:700}

/* result */
.result{text-align:center;padding:20px 0}
.result .big{font-family:var(--display);font-weight:800;font-size:56px;line-height:1}
.rew{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:18px 0}
.rew div{border:1.5px solid var(--ink);border-radius:14px;background:var(--card);padding:12px}
.rew b{font-family:var(--display);font-weight:800;font-size:24px;display:block}

/* league */
.tier{display:grid;grid-template-columns:12px 1fr auto;gap:10px;align-items:center;padding:8px 0;border-top:1px dashed var(--line)}
.tier:first-child{border-top:0}
.dot{width:12px;height:12px;border-radius:4px;border:1.2px solid var(--ink);flex:none}
.divs{display:flex;gap:4px}
.divs span{font-size:11px;font-weight:700;border:1.2px solid var(--line);border-radius:6px;padding:0 6px;color:var(--muted)}
.shields{display:flex;gap:6px}
.shields svg{width:24px;height:24px}
.log{font-size:12.5px;color:var(--muted);margin-top:8px;display:grid;gap:3px;min-height:58px}
.rk{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:center;padding:8px 6px;border-top:1px dashed var(--line)}
.rk:first-child{border-top:0}
.rk .pos{font-family:var(--display);font-weight:800;font-size:17px;text-align:center}
.rk.me{background:linear-gradient(90deg,rgba(255,217,59,.5),transparent);border-radius:8px}
.seg{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:8px}
.seg button{flex:none;border:1.5px solid var(--ink);background:var(--card);border-radius:99px;padding:4px 11px;font-size:13px;font-weight:600}
.seg button[aria-pressed="true"]{background:var(--ink);color:#fff}

/* friends & me */
.fr{display:grid;grid-template-columns:42px 1fr auto;gap:10px;align-items:center;padding:10px 0;border-top:1px dashed var(--line)}
.fr:first-child{border-top:0}
.ava{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-weight:700;background:var(--paper);border:1.5px solid var(--ink);position:relative}
.ava.on::after{content:"";position:absolute;right:-1px;bottom:-1px;width:11px;height:11px;border-radius:50%;background:var(--good);border:2px solid #fff}
.prof{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center}
.pava{width:76px;height:76px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:30px;background:var(--paper)}
.fr-basic{border:2px solid var(--ink)}
.fr-ink{border:5px solid var(--ink)}
.fr-hl{border:5px dashed var(--ink);background:var(--hl)}
.fr-star{border:5px solid transparent;background:linear-gradient(var(--paper),var(--paper)) padding-box,conic-gradient(var(--hl),var(--blue),var(--bad),var(--hl)) border-box}
.abil{display:grid;grid-template-columns:96px 1fr 44px;gap:10px;align-items:center;padding:6px 0;font-size:14px}
.abil .v{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.abil.weak .bar i{background:var(--bad)}
.ach{display:grid;grid-template-columns:36px 1fr auto;gap:10px;align-items:center;padding:9px 0;border-top:1px dashed var(--line)}
.ach:first-child{border-top:0}
.medal{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;border:1.5px solid var(--ink);background:#eef1fa}
.medal svg{width:18px;height:18px}
.medal.on{background:var(--hl)}
.rew-road{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 6px}
.rew-road div{flex:none;width:96px;border:1.5px solid var(--ink);border-radius:12px;padding:8px;background:var(--card);font-size:12px}
.rew-road div.off{border-style:dashed;color:var(--muted);background:transparent}
.rew-road b{display:block;font-family:var(--display);font-weight:800;font-size:15px}
.invite{border:1.5px solid var(--ink);border-radius:16px;background:#eef1fa;padding:14px;margin:12px 0}
.inp{width:100%;border:1.5px solid var(--ink);border-radius:10px;padding:10px 12px;font:inherit;background:#fff;color:var(--ink);margin-top:4px}
.inp:focus{outline:3px solid var(--blue);outline-offset:1px}
.vsbox{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;margin:16px 0 8px}
.vsbox>div:not(.vs){border:1.5px solid var(--ink);border-radius:14px;background:var(--card);padding:10px 8px;text-align:center}
.vsbox small{display:block;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vsbox b{display:block;font-family:var(--display);font-weight:800;font-size:28px;line-height:1.3}
.vsbox span{font-size:12px;color:var(--muted)}
.vs{font-family:var(--display);font-weight:800;font-size:18px}
.outcome{font-size:21px;margin:6px 0 4px}
.outcome.win{color:var(--good)}.outcome.lose{color:var(--bad)}
.price{font-family:var(--display);font-weight:800;font-size:34px;line-height:1.3;margin:4px 0}
.cardimg{width:auto;max-width:100%;max-height:56vh;border-radius:12px;border:1.5px solid var(--ink);display:block;margin:10px auto}
.cta-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.invite .link{font-family:ui-monospace,Menlo,monospace;font-size:12px;background:#fff;border:1px dashed var(--lock);border-radius:8px;padding:6px 8px;margin-top:8px;color:var(--muted);word-break:break-all}

/* community */
.post{background:var(--card);border:1.5px solid var(--ink);border-radius:16px;padding:14px}
.post+.post{margin-top:12px}
.post-h{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted);margin-bottom:10px}
.post-h .ava{width:28px;height:28px;font-size:12px}
.cho{font-family:var(--display);font-weight:800;font-size:32px;letter-spacing:6px;line-height:1.2}
.ans{display:inline-block;font-weight:700;font-size:20px;background:linear-gradient(var(--hl),var(--hl)) left bottom/100% .3em no-repeat;padding:0 .1em .08em}
.vote{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.vres{display:grid;gap:6px;margin-top:12px}
.vrow{display:grid;grid-template-columns:auto 1fr 44px;gap:8px;align-items:center;font-size:13px}
.vrow .bar i{background:var(--lock)}
.vrow.mine b{color:var(--blue)}
.vrow b{white-space:nowrap;min-width:92px}
.vrow.mine .bar i{background:var(--blue)}
.vrow span:last-child{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.result-text{margin:0;font-size:17px;font-weight:600;line-height:1.65;word-break:keep-all}
.poem{display:grid;gap:6px}
.poem div{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:baseline;font-size:15.5px}
.poem b{font-family:var(--display);font-weight:800;font-size:19px;min-width:1.4em;background:linear-gradient(var(--hl),var(--hl)) left bottom/100% .3em no-repeat;padding:0 .1em .08em}
.story{display:grid;gap:6px}
.sline{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:start;text-align:left;border:1px solid var(--line);border-radius:12px;background:#fafbfe;padding:8px 10px;font-size:14px}
.sline small{display:block;font-size:11px;font-weight:700;color:var(--muted)}
.sline .hrt{font-size:12px;color:var(--muted);font-weight:700;white-space:nowrap}
.sline.best{border-color:var(--ink);background:#fff7cf}
.sline.best .hrt{color:var(--bad)}

/* modal + toast */
.modal{position:absolute;inset:0;background:rgba(21,28,69,.55);display:none;align-items:flex-end;z-index:40}
.modal.open{display:flex}
.mbox{background:var(--card);border-radius:22px 22px 0 0;width:100%;padding:20px 18px calc(18px + env(safe-area-inset-bottom));max-height:88%;overflow-y:auto;border-top:2px solid var(--ink)}
.mbox h2{font-family:var(--display);font-weight:800;font-size:24px;margin:8px 0 6px}
.mbox ul{padding-left:18px;margin:10px 0 14px}
.mbox li{margin:4px 0;font-size:14px}
.toast{position:absolute;left:50%;top:calc(64px + env(safe-area-inset-top));transform:translate(-50%,-14px);opacity:0;pointer-events:none;background:var(--ink);color:#fff;padding:9px 16px;border-radius:99px;font-size:13.5px;font-weight:600;z-index:60;transition:opacity .2s,transform .2s;max-width:90%;text-align:center;box-shadow:3px 3px 0 var(--hl)}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ===== v5 테마: 밝은 게임 플랫폼 (주황빛 레드 브랜드 + 남색 + 골드) ===== */
:root{--paper:#F3F4FA;--card:#fff;--ink:#1B1E3C;--muted:#6B7094;--line:#E2E5F1;--blue:#4C6FFF;--hl:#FFD43B;--good:#16B364;--bad:#F04438;--lock:#A3A8C3;
  --brand:#FF5A36;--brand-d:#D9431F;--gold:#FFC53D;--gold-d:#D99A0B;--navy:#1B1E3C;--navy-d:#0B0D22}
body{background:var(--navy)}
#app{background-image:none;background-color:var(--paper)}
.top{background:#fff;border-bottom:1px solid var(--line)}
.logo{font-size:23px;letter-spacing:-.03em}.logo .du{color:var(--brand)}
.logo small{border:0;background:var(--paper);color:var(--muted);border-radius:6px;padding:2px 6px}
.chip{border:0;background:var(--paper);padding:4px 9px}
.tierchip{background:var(--paper);border:0}
.tabs{border-top:1px solid var(--line);background:#fff}
.tabs button svg{box-sizing:content-box;padding:3px 12px;border-radius:12px}
.tabs button[aria-current="page"]{color:var(--brand)}
.tabs button[aria-current="page"] svg{background:#FFE8E1}
.tabs button[aria-current="page"] span{border-bottom-color:transparent;font-weight:800}
.mark{background:linear-gradient(#FFE08A,#FFE08A) left bottom/100% .32em no-repeat}
.card{border:0;border-radius:20px;box-shadow:0 1px 0 var(--line),0 6px 20px rgba(27,30,60,.06)}
.tap{border:2px solid var(--line);border-radius:18px;box-shadow:0 4px 0 var(--line)}
.tap:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.tap.locked{border:2px dashed #D5D9EA;box-shadow:none;background:#F8F9FC}
.tap.off{box-shadow:0 2px 0 var(--line);background:#FAFAFD}
.feat{background:linear-gradient(135deg,#FF5A36,#FF8A3D);border-color:transparent;color:#fff;box-shadow:0 4px 0 var(--brand-d)}
.feat:active{box-shadow:0 1px 0 var(--brand-d)}
.feat .t-sub,.feat .t-meta,.feat .tro{color:rgba(255,255,255,.9)}
.btn{border:0;border-radius:14px;background:var(--navy);box-shadow:0 4px 0 var(--navy-d);transition:transform .06s,box-shadow .06s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--navy-d)}
.btn.hl{background:var(--gold);color:var(--navy);box-shadow:0 4px 0 var(--gold-d)}
.btn.hl:active{box-shadow:0 1px 0 var(--gold-d)}
.btn.brand{background:var(--brand);color:#fff;box-shadow:0 4px 0 var(--brand-d)}
.btn.brand:active{box-shadow:0 1px 0 var(--brand-d)}
.btn.ghost{background:#fff;color:var(--ink);border:2px solid var(--line);box-shadow:0 4px 0 var(--line)}
.btn.ghost:active{box-shadow:0 1px 0 var(--line)}
.btn[disabled]{box-shadow:none;transform:none;border:2px dashed var(--lock)}
.bar{border:0;background:#E6E9F5}
.bar.hlb i{background:linear-gradient(90deg,#FFC53D,#FF8A3D)}
.flame{border:0;background:linear-gradient(135deg,#FFE27A,#FFB020);box-shadow:0 3px 0 #D99A0B}
.notice{border:0;background:#FFF4D1}
.seg button{border:2px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:#fff}
.tag.hl{border-color:transparent}
.sheet{background-image:none}
.sh-head{background:#fff;border-bottom:1px solid var(--line)}
.sh-foot{border-top:1px solid var(--line)}
.x{border:2px solid var(--line)}
.opt,.piece,.mbtn,.ctx,.passage,details.pv,.exam,.slots{border-width:2px;border-color:var(--line)}
.opt{box-shadow:0 3px 0 var(--line)}
.qopts button{border:2px solid var(--line);box-shadow:0 4px 0 var(--line)}
.flash{border:2px solid var(--line);box-shadow:0 5px 0 var(--line)}
.rew div,.vsbox>div:not(.vs),.invite,.post{border:2px solid var(--line)}
.mbox{border-top:0;border-radius:24px 24px 0 0}
.ck{border-color:var(--line)}
/* 눈에 띄는 배너 */
.promo{display:grid;grid-template-columns:46px 1fr auto;gap:12px;align-items:center;width:100%;text-align:left;border:0;border-radius:20px;padding:16px;color:#fff;transition:transform .06s,box-shadow .06s}
.promo .ic{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;background:rgba(255,255,255,.22)}
.promo .ic svg{width:26px;height:26px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.promo b{display:block;font-family:var(--display);font-weight:800;font-size:18px;line-height:1.3}
.promo small{display:block;font-size:12.5px;opacity:.92;margin-top:2px}
.promo .go{font-weight:800;font-size:24px;line-height:1}
.promo:active{transform:translateY(3px)}
.promo.duel{background:linear-gradient(135deg,#FF5A36,#FF2D6F);box-shadow:0 5px 0 #B8233F}
.promo.duel:active{box-shadow:0 2px 0 #B8233F}
.promo.pro{background:linear-gradient(135deg,#FFD84F,#FF9F1C);color:#3A2600;box-shadow:0 5px 0 #C9790A}
.promo.pro:active{box-shadow:0 2px 0 #C9790A}
.promo.pro .ic{background:rgba(255,255,255,.5)}
.promo.wait{background:var(--navy);box-shadow:0 5px 0 var(--navy-d)}
.promo.wait:active{box-shadow:0 2px 0 var(--navy-d)}
.promo.wait .ic{color:var(--gold)}
.promo-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.promo-grid .promo{grid-template-columns:1fr;gap:10px;padding:14px;align-content:start}
.shine{position:relative;overflow:hidden}
.shine::after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.6),transparent);animation:shine 3.4s infinite;pointer-events:none}
@keyframes shine{0%,55%{left:-60%}100%{left:130%}}
/* 플레이 화면 (v6.7) */
.phero{position:relative;overflow:hidden;border-radius:24px;padding:18px 18px 16px;color:#fff;background:linear-gradient(140deg,var(--navy) 0%,#2a2f66 100%);box-shadow:0 6px 0 var(--navy-d)}
.ph-blob{position:absolute;border-radius:50%;pointer-events:none}
.ph-blob.b1{width:170px;height:170px;right:-50px;top:-60px;background:var(--c);opacity:.9}
.ph-blob.b2{width:90px;height:90px;right:70px;top:60px;background:var(--gold);opacity:.18}
.ph-top{position:relative;display:flex;align-items:center;justify-content:space-between;gap:8px}
.ph-tag{font-size:12px;font-weight:800;background:var(--gold);color:#3A2600;border-radius:999px;padding:4px 10px}
.ph-cat{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:800;background:rgba(255,255,255,.18);border-radius:999px;padding:3px 10px 3px 4px}
.ph-ci{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:var(--cd)}
.ph-ci svg{width:14px;height:14px;stroke:#fff;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.ph-title{position:relative;font-family:var(--display);font-weight:800;font-size:26px;line-height:1.25;margin-top:16px;max-width:85%}
.ph-sub{position:relative;font-size:13px;opacity:.85;margin-top:4px;max-width:90%}
.ph-row{position:relative;display:flex;align-items:center;gap:12px;margin-top:16px}
.ph-go{border:0;border-radius:14px;background:#fff;color:var(--navy);font-weight:800;font-size:16px;padding:12px 20px;box-shadow:0 4px 0 rgba(0,0,0,.35);transition:transform .06s,box-shadow .06s}
.ph-go:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.35)}
.ph-note{font-size:12px;font-weight:700;color:var(--gold)}
.lgband{display:grid;grid-template-columns:44px 1fr auto auto;gap:10px;align-items:center;width:100%;text-align:left;margin-top:14px;border:0;border-radius:18px;padding:12px 14px;color:#3A2600;background:linear-gradient(120deg,#FFE27A,#FFB938 60%,#FF9F1C);box-shadow:0 4px 0 #C9790A;transition:transform .06s,box-shadow .06s}
.lgband:active{transform:translateY(3px);box-shadow:0 1px 0 #C9790A}
.lg-ic{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:rgba(255,255,255,.55)}
.lg-ic svg{width:26px;height:26px;stroke:#3A2600;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.lg-mid b{display:block;font-family:var(--display);font-weight:800;font-size:16px}
.lg-mid small{display:block;font-size:12px;font-weight:600;opacity:.85;margin-top:1px}
.lg-d{font-weight:800;font-size:13px;background:#3A2600;color:#FFE27A;border-radius:999px;padding:4px 9px}
.lg-go{font-weight:800;font-size:22px}
.qrow{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.qchip{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;border:2px solid var(--line);background:var(--card);border-radius:16px;padding:10px;box-shadow:0 3px 0 var(--line);min-width:0;transition:transform .06s,box-shadow .06s}
.qchip:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
.qchip .qi{font-size:20px;line-height:1}
.qchip b{font-size:13.5px;margin-top:4px}
.qchip small{font-size:10.5px;color:var(--muted);line-height:1.3}
.qchip.off{opacity:.65}
.cgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ctile{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:6px;text-align:left;min-width:0;border:2px solid var(--line);border-radius:20px;padding:14px;background:linear-gradient(180deg,color-mix(in srgb,var(--c) 10%,#fff),#fff 70%);box-shadow:0 4px 0 var(--line);transition:transform .06s,box-shadow .06s}
.ctile:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.ctile .ci{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:var(--c);box-shadow:0 3px 0 var(--cd)}
.ctile .ci svg{width:24px;height:24px;stroke:#fff;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.ct-t{font-family:var(--display);font-weight:800;font-size:16px;line-height:1.3;margin-top:4px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.ct-hot{font-style:normal;font-size:10.5px;font-weight:800;background:var(--gold);color:#3A2600;border-radius:999px;padding:2px 7px}
.ct-s{font-size:12px;color:var(--muted);line-height:1.35;min-height:32px}
.ct-f{display:flex;align-items:center;justify-content:space-between;width:100%;margin-top:2px}
.ct-n{font-size:12px;font-weight:700;color:var(--muted)}
.cgrid .ctile:last-child:nth-child(odd){grid-column:1/-1;display:grid;grid-template-columns:44px 1fr auto;grid-template-areas:"ci t f" "ci s f";column-gap:12px;row-gap:2px;align-items:center;background:linear-gradient(90deg,color-mix(in srgb,var(--c) 10%,#fff),#fff 70%)}
.cgrid .ctile:last-child:nth-child(odd) .ci{grid-area:ci}
.cgrid .ctile:last-child:nth-child(odd) .ct-t{grid-area:t;margin-top:0}
.cgrid .ctile:last-child:nth-child(odd) .ct-s{grid-area:s;min-height:0}
.cgrid .ctile:last-child:nth-child(odd) .ct-f{grid-area:f;flex-direction:column;align-items:flex-end;gap:4px;width:auto;margin:0}
.ctile.locked{background:#F6F7FB;border-style:dashed}
.ctile.locked .ci{background:#CDD1E3;box-shadow:none}
.ctile.locked .ct-t{color:var(--muted)}
/* 플레이 카테고리: 모드마다 고유 색 */
.cat{display:grid;grid-template-columns:52px 1fr auto;gap:12px;align-items:center}
.cat .ci{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;background:var(--c);box-shadow:0 3px 0 var(--cd)}
.cat .ci svg{width:28px;height:28px;stroke:#fff;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.cat.locked .ci{background:#CDD1E3;box-shadow:none}
.cat .t-title{font-size:17px}
.cat-r{display:grid;justify-items:end;gap:4px}
.sublist .tap:not(.locked){border-left:6px solid var(--c)}
.subhead{display:flex;align-items:center;gap:12px;margin-top:14px}
.subhead .ci{width:48px;height:48px;border-radius:15px;display:grid;place-items:center;background:var(--c);box-shadow:0 3px 0 var(--cd);flex:none}
.subhead .ci svg{width:26px;height:26px;stroke:#fff;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
@media (prefers-reduced-motion:reduce){.shine::after{display:none}}
/* v6.4 장면 분리 */
.phone{margin-top:14px;border:2.5px solid var(--navy);border-radius:18px;overflow:hidden;background:#C9D6E8}
.phone .phead{display:flex;align-items:center;gap:8px;background:var(--navy);color:#fff;font-size:13px;font-weight:700;padding:8px 12px}
.phone .ptag{background:var(--gold);color:var(--navy);border-radius:999px;padding:2px 9px;font-weight:800}
.phone .chat{padding:10px}
.phone + .ctx{margin-top:14px}
/* v6.3 */
.unread{display:inline-block;margin-left:6px;padding:0 5px;border-radius:6px;background:#1B1E3C;color:#FFC53D;font-weight:800;font-size:12px;line-height:18px}
/* v6.0 에피소드 */
.epwrap{display:flex;flex-direction:column;gap:6px}
.epchips{display:flex;gap:6px;flex-wrap:wrap;padding-left:8px}
.epchip{font-size:12px;font-weight:700;padding:5px 10px;border-radius:999px;border:1.5px solid var(--line);background:var(--card);color:var(--ink)}
.epchip.done{color:#5b6080}
.epchip.cur{border-color:var(--c);color:var(--c);background:color-mix(in srgb,var(--c) 10%,#fff)}
.tag.ep{background:var(--navy);color:#fff}
/* v5.9 파란 공유 버튼 · 체인 칩 · 재도전 잠금 */
.btn.blue-glow{background:linear-gradient(180deg,#4DA3FF 0%,#1F6BFF 100%);color:#fff;box-shadow:0 4px 0 #1446b8,0 0 0 0 rgba(47,128,255,.55);position:relative;overflow:hidden;animation:blueGlow 2s ease-in-out infinite}
.btn.blue-glow:active{box-shadow:0 1px 0 #1446b8}
.btn.blue-glow::after{content:'';position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.35) 50%,transparent 70%);transform:translateX(-100%);animation:waitShine 2.6s ease-in-out infinite}
@keyframes blueGlow{0%,100%{box-shadow:0 4px 0 #1446b8,0 0 10px 0 rgba(47,128,255,.45)}50%{box-shadow:0 4px 0 #1446b8,0 0 26px 6px rgba(47,128,255,.6)}}
.btn.retry-lock{background:#eef1f8;color:#5b6080;border:2px dashed #b9c0d6;box-shadow:none;font-size:14px}
.btn.retry-on{animation:retryPop .5s ease-out}
@keyframes retryPop{0%{transform:scale(.94)}60%{transform:scale(1.03)}100%{transform:scale(1)}}
.chainbox2{margin:14px 0 6px;padding:12px;border-radius:16px;background:linear-gradient(135deg,#EEF4FF 0%,#F6F0FF 100%);border:2px solid #cfdcff;text-align:left}
.chead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.cbadge{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:999px;background:var(--navy);color:#fff;font-size:12px;font-weight:800}
.crow{display:flex;align-items:center;overflow-x:auto;padding:12px 2px 4px;scrollbar-width:none}.crow::-webkit-scrollbar{display:none}
.clink{flex:1 0 14px;min-width:14px;height:3px;margin:0 2px 30px;border-radius:2px;background:repeating-linear-gradient(90deg,#8aa8ff 0 6px,transparent 6px 10px)}
.cnode{position:relative;display:flex;flex-direction:column;align-items:center;min-width:64px;flex:none}
.cav{width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:#fff;border:2.5px solid #9fb5f0;font-weight:800;font-size:17px;color:var(--navy)}
.cname{font-size:12px;font-weight:800;margin-top:4px;max-width:70px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cmeta{font-size:10.5px;color:#5b6080;display:flex;align-items:center;gap:3px;white-space:nowrap}
.grade.xs{min-width:16px;height:16px;padding:0 3px;border-radius:5px;font-size:10px}
.cnode.me .cav{background:linear-gradient(180deg,#4DA3FF,#1F6BFF);color:#fff;border-color:#1446b8;box-shadow:0 0 0 4px rgba(47,128,255,.2)}
.cnode.lead .cav{border-color:#E0A100;box-shadow:0 0 0 3px rgba(255,197,61,.45)}
.ccrown{position:absolute;top:-13px;left:50%;transform:translateX(-50%);width:20px;height:20px;color:#E0A100}
.ccrown svg{width:20px;height:20px;fill:#FFC53D;stroke:#E0A100;stroke-width:1.5}
.cnode.next .cav{border-style:dashed;background:transparent;color:#8aa8ff;animation:nextPulse 1.6s ease-in-out infinite}
.cnode.more .cav{border-style:dotted;background:transparent;color:#8a8fa8}
@keyframes nextPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
.cfoot{margin-top:8px;color:#5b6080}
@media (prefers-reduced-motion:reduce){.btn.blue-glow,.btn.blue-glow::after,.cnode.next .cav{animation:none}}
/* v5.8 결과 화면 보조 버튼 */
.btn.story-btn{background:linear-gradient(45deg,#FFB13D 0%,#FF5A36 35%,#E8306E 65%,#8A3FFC 100%);color:#fff;box-shadow:0 4px 0 #9b2350;gap:8px}
.btn.story-btn:active{box-shadow:0 1px 0 #9b2350}
.story-ring{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:50%;border:2px solid #fff;background:rgba(255,255,255,.18)}
.btn.topic-btn{background:transparent;border:2px dashed #9aa0c3;color:var(--ink);box-shadow:none;justify-content:flex-start;gap:10px;padding:10px 12px;text-align:left;margin:12px 0 4px}
.btn.topic-btn .topic-ic{font-size:20px;line-height:1}
.btn.topic-btn .topic-tx{display:flex;flex-direction:column;gap:2px;flex:1;min-width:0}
.btn.topic-btn .topic-tx small{font-size:11px;font-weight:600;color:var(--muted,#5b6080)}
.btn.topic-btn .soon{font-size:11px;font-weight:800;background:#eef0f8;color:#5b6080;border-radius:999px;padding:3px 8px;white-space:nowrap}

function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function dkey(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
const rand=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
/* 받침 유무로 을/를 고르기 */
const jo=(w,y,n)=>{const c=w.charCodeAt(w.length-1);return w+((c>=0xAC00&&c<=0xD7A3&&(c-0xAC00)%28)?y:n)};
const eul=w=>{const c=w.charCodeAt(w.length-1);return w+((c>=0xAC00&&c<=0xD7A3&&(c-0xAC00)%28)?'을':'를')};
/* 하루의 시작 = 아침 6시 */
const DAY_START=6;
const gday=(t=Date.now())=>dkey(new Date(t-DAY_START*36e5));
const gidx=(t=Date.now())=>{const d=new Date(t-DAY_START*36e5);return Math.floor(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())/864e5)};
function nextReset(){const n=new Date(),r=new Date(n);r.setHours(DAY_START,0,0,0);if(n>=r)r.setDate(r.getDate()+1);return r.getTime()}
function fmtLeft(ms){ms=Math.max(0,ms);const s=Math.ceil(ms/1000),h=Math.floor(s/3600),m=Math.floor(s%3600/60),ss=s%60;return h?`${h}시간 ${m}분`:`${String(m).padStart(2,'0')}:${String(ss).padStart(2,'0')}`}

const READS=[
{id:'r1',title:'새벽 2시에 보낸 메시지가 부끄러운 이유',tag:'뇌과학',body:[
 '밤늦게 친구에게 길고 진지한 메시지를 보낸 뒤, 다음 날 아침 그 메시지를 다시 읽고 이불을 걷어찬 경험이 있을 것이다. 이런 일이 생기는 데에는 이유가 있다.',
 '우리 뇌의 앞쪽에 있는 전전두엽은 계획을 세우고, 감정을 조절하고, 말과 행동을 절제하는 일을 맡는다. 연구자들은 잠이 부족하거나 몹시 피곤할 때 이 부분의 기능이 평소보다 떨어진다고 설명한다. 반면 감정과 관련된 반응은 피로할수록 오히려 커지기 쉽다.',
 '그래서 밤에는 작은 서운함도 크게 느껴지고, 그 감정을 그대로 글로 옮기게 된다. 문제는 아침이 되면 충분히 쉰 뇌가 같은 글을 훨씬 냉정하게 읽는다는 점이다. 어젯밤의 나와 오늘 아침의 나는, 같은 글을 전혀 다르게 읽는 두 명의 독자인 셈이다.'],
items:[
 {id:'r1-1',type:'mc',ab:'lit',kind:'내용 이해',q:'윗글의 내용과 일치하는 것은?',opts:['전전두엽은 감정을 더 크게 느끼게 만드는 곳이다.','피곤할수록 감정 반응은 줄어들고 판단력은 좋아진다.','피로하면 말과 행동을 절제하는 기능이 평소보다 떨어질 수 있다.','아침에 다시 읽은 글은 밤보다 더 감정적으로 느껴진다.'],ans:2,exp:'2문단에서 전전두엽이 ‘절제’를 맡고, 피곤할 때 그 기능이 떨어진다고 했어요. ①은 역할을 거꾸로 말했고, ②④는 글과 반대예요.'},
 {id:'r1-2',type:'mc',ab:'voc',kind:'어휘',q:'‘말과 행동을 절제하는 일’에서 ‘절제’의 뜻으로 알맞은 것은?',opts:['정도를 넘지 않게 알맞게 조절함','어떤 일을 완전히 끊어 버림','물건을 잘라서 나눔','남의 행동을 대신함'],ans:0,exp:'절제(節制)는 ‘정도를 넘지 않도록 알맞게 조절하여 제한함’이에요. 완전히 끊는 건 ‘단절’에 가까워요.'},
 {id:'r1-3',type:'mc',ab:'inf',bonus:true,kind:'추론',q:'글쓴이의 설명을 바탕으로 할 때, 가장 현명한 행동은?',opts:['감정이 클 때 쓴 중요한 메시지는 저장해 두고 아침에 다시 읽은 뒤 보낸다.','밤에는 솔직해지므로 중요한 말은 밤에 보내는 것이 좋다.','전전두엽을 쓰지 않도록 메시지를 짧게 쓴다.','아침에는 감정이 없으므로 아침에만 대화한다.'],ans:0,exp:'밤엔 감정이 커지고 절제 기능이 약해지며, 아침엔 같은 글을 냉정하게 읽는다고 했어요. 그러니 ‘아침에 다시 읽기’가 글에서 끌어낼 수 있는 결론이에요.'},
 {id:'r1-4',type:'mc',ab:'cri',bonus:true,kind:'비판적 사고',q:'윗글에 던질 수 있는 가장 날카로운 질문은?',opts:['밤에 일하고 낮에 자는 사람에게도 ‘밤’ 이야기가 똑같이 맞을까?','전전두엽은 정말 뇌의 앞쪽에 있을까?','메시지는 글로 쓰는 것일까?','아침이 오면 해가 뜰까?'],ans:0,exp:'글의 핵심은 시간 자체가 아니라 ‘피로’예요. 그런데 글은 ‘밤 = 피곤함’을 당연하게 전제해요. 그 전제를 겨누는 질문이 가장 날카로워요.'}
]},
{id:'r2',title:'급식 메뉴 투표, 정말 공정했을까',tag:'학교 생활',body:[

items:[
 {id:'r2-1',type:'mc',ab:'lit',kind:'정보 처리',q:'투표에 참여한 학생은 전교생의 약 몇 %인가?',opts:['약 8%','약 13%','약 60%','약 72%'],ans:1,exp:'900명 중 120명이니 120÷900 ≈ 13%. 60%는 ‘참여자 중’ 마라탕을 고른 비율이라 헷갈리기 쉬워요.'},

 '다운로드는 무료인데 회사는 어떻게 돈을 벌까? 무료 게임의 수입원은 크게 두 가지다. 하나는 게임 중간에 나오는 광고이고, 다른 하나는 게임 안에서 아이템이나 이용권을 사게 하는 ‘인앱 결제’다.',
 '흥미로운 점은 인앱 결제로 들어오는 돈이 모든 이용자에게서 고르게 나오지 않는다는 것이다. 대부분은 한 푼도 내지 않고, 소수의 이용자가 큰 금액을 결제하는 경우가 많다고 알려져 있다. 업계에서는 이렇게 큰돈을 쓰는 이용자를 ‘고래’라고 부르기도 한다.',
 '그래서 무료 게임에는 ‘조금만 더’ 결제하게 만드는 장치가 곳곳에 숨어 있다. 몇 시간만 열리는 한정 할인, 줄어드는 남은 시간 표시, 다음 보상이 코앞이라고 알려 주는 알림 같은 것들이다. ‘무료’라는 말 뒤에 숨은 설계를 읽어 내는 것도 문해력이다.'],
items:[
 {id:'r4-1',type:'mc',ab:'lit',kind:'내용 이해',q:'윗글의 내용과 일치하는 것은?',opts:['무료 게임은 광고로만 돈을 번다.','인앱 결제 수입은 모든 이용자에게서 고르게 나온다.','소수의 이용자가 큰 금액을 결제하는 경우가 많다.','한정 할인은 이용자에게 언제나 이득이다.'],ans:2,exp:'2문단에 ‘대부분은 한 푼도 내지 않고, 소수의 이용자가 큰 금액을 결제하는 경우가 많다’고 나와요. 수입원은 광고와 인앱 결제 두 가지라 ①은 틀렸어요.'},
 {id:'r4-2',type:'mc',ab:'voc',kind:'어휘',q:'윗글에서 ‘고래’가 가리키는 것은?',opts:['바다에 사는 큰 포유류','게임 속 보스 몬스터','큰돈을 결제하는 소수의 이용자','광고를 끝까지 보는 이용자'],ans:2,exp:'‘업계에서는 이렇게 큰돈을 쓰는 이용자를 고래라고 부르기도 한다’ — 앞 문장을 가리키는 ‘이렇게’를 따라가면 돼요.'},
 {id:'r4-3',type:'mc',ab:'inf',bonus:true,kind:'추론',q:'‘오늘만 70% 할인! 남은 시간 02:59’ 창이 떴다. 글쓴이의 관점에서 가장 현명한 생각은?',opts:['시간이 없으니 일단 사고 나중에 생각한다.','급하게 만드는 장치일 수 있으니, 할인이 없어도 살 물건인지 먼저 따진다.','70%나 할인하니 무조건 이득이다.','남은 시간이 끝나면 다시는 할인하지 않는다.'],ans:1,exp:'3문단의 ‘한정 할인, 줄어드는 남은 시간 표시’는 결제를 서두르게 만드는 장치로 소개돼요. 시간 압박을 걷어 내고 ‘원래 필요했나’를 묻는 게 글쓴이의 관점이에요.'},
 {id:'r4-4',type:'mc',ab:'cri',bonus:true,kind:'비판적 사고',q:'윗글을 읽고 던질 수 있는 가장 날카로운 질문은?',opts:['광고로만 운영되는 게임은 이용자에게서 돈 대신 무엇(시간·관심 등)을 받고 있을까?','게임은 정말 다운로드해야 할까?','고래는 정말 포유류일까?','인앱 결제는 영어로 무엇일까?'],ans:0,exp:'글은 ‘돈을 내는 방식’만 다뤄요. 돈을 안 내는 이용자도 광고를 보는 시간과 관심으로 값을 치를 수 있다는 점을 묻는 ①이 글의 빈틈을 짚어요.'}

READS.push({id:'r5',title:'MBTI 설명이 다 내 얘기 같은 이유',tag:'심리',body:[
 '“당신은 겉으로는 밝아 보이지만, 속으로는 걱정이 많은 편이다.” 성격 유형 설명을 읽다가 ‘완전 내 얘기잖아’ 하고 놀란 적이 있을 것이다. 그런데 이 문장은 사실 거의 모든 사람에게 들어맞는다.',
 '1948년 심리학자 버트럼 포러는 학생들에게 성격 검사를 하게 한 뒤, ‘개인별 분석 결과’라며 설명문을 나눠 주었다. 학생들은 그 설명이 자기와 얼마나 맞는지 5점 만점으로 매겼고, 평균은 4점을 넘었다. 그런데 사실 모든 학생이 받은 설명은 똑같은 문장이었다. 이처럼 누구에게나 해당되는 애매한 말을 나만을 위한 정확한 설명으로 받아들이는 현상을 ‘바넘 효과’라고 부른다.',
 '바넘 효과가 잘 생기는 문장에는 공통점이 있다. 반대되는 모습을 함께 담거나(“때로는 외향적이지만 때로는 혼자 있고 싶다”), 듣기 좋은 말을 섞는다. 그렇다고 성격 유형 이야기가 모두 쓸모없다는 뜻은 아니다. 다만 ‘딱 맞는다’는 느낌만으로 그 설명이 정확하다고 단정하기는 어렵다는 것이다.'],
items:[
 {id:'r5-1',type:'mc',ab:'lit',kind:'내용 이해',q:'윗글의 내용과 일치하는 것은?',opts:['포러의 실험에서 학생들은 각자 다른 설명을 받았다.','학생들은 받은 설명이 자기와 잘 맞지 않는다고 평가했다.','학생들이 받은 설명은 모두 같은 문장이었다.','글쓴이는 성격 유형 이야기가 모두 쓸모없다고 주장한다.'],ans:2,exp:'2문단에 ‘모든 학생이 받은 설명은 똑같은 문장’이라고 나와요. 평균 4점이 넘었으니 ②는 반대이고, 글쓴이는 3문단에서 ‘모두 쓸모없다는 뜻은 아니다’라고 했어요.'},
 {id:'r5-2',type:'mc',ab:'voc',kind:'어휘',q:'‘바넘 효과’를 가장 잘 설명한 것은?',opts:['누구에게나 맞는 애매한 말을 나에게만 맞는 설명으로 믿는 것','칭찬을 들으면 기분이 좋아지는 것','검사를 여러 번 하면 결과가 바뀌는 것','유명한 사람의 말을 무조건 믿는 것'],ans:0,exp:'2문단 마지막 문장이 정의예요. ‘누구에게나 해당되는 애매한 말’ + ‘나만을 위한 설명으로 받아들임’ 두 부분이 다 들어가야 해요.'},
 {id:'r5-3',type:'mc',ab:'inf',bonus:true,kind:'추론',q:'다음 중 바넘 효과를 일으키기 가장 쉬운 문장은?',opts:['너는 지난 수학 시험에서 92점을 받았다.','너는 매일 아침 7시에 일어난다.','너는 친구를 아끼지만, 가끔은 혼자만의 시간이 필요하다.','너는 형제가 두 명이다.'],ans:2,exp:'③은 반대되는 모습(친구를 아낌 + 혼자 있고 싶음)을 함께 담아 거의 모든 사람이 ‘내 얘기’라고 느껴요. 나머지는 사실인지 아닌지 바로 확인되는 구체적인 문장이에요.'},
 {id:'r5-4',type:'mc',ab:'cri',bonus:true,kind:'비판적 사고',q:'내 성격 유형 설명이 정말 정확한지 확인하는 방법으로 가장 알맞은 것은?',opts:['설명을 다시 읽고 맞는다는 느낌이 드는지 확인한다.','친구들에게 내 설명을 보여 주고 맞는지 물어본다.','이름을 가린 다른 유형의 설명도 읽어 보고, 그것도 내 얘기 같은지 비교한다.','설명이 길고 자세한지 확인한다.'],ans:2,exp:'포러 실험처럼 다른 설명도 ‘내 얘기’ 같다면, 그 느낌은 정확하다는 근거가 될 수 없어요. ①②는 결국 ‘느낌’을 한 번 더 확인할 뿐이에요.'}
]});
READS.push({id:'r6',title:'랜덤 포카, 10장 사면 무조건 나올까',tag:'확률',body:[
 '앨범을 사면 멤버 10명 중 한 명의 포토카드가 무작위로 한 장 들어 있다. 내가 좋아하는 멤버는 한 명. 10장 중 1장꼴로 나오니까, 10장만 사면 반드시 한 번은 나오지 않을까?',
 '계산해 보면 그렇지 않다. 모든 카드가 나올 확률이 같다면, 한 장을 뜯었을 때 원하는 멤버가 안 나올 확률은 10분의 9다. 10장을 뜯어 한 번도 안 나올 확률은 10분의 9를 열 번 곱한 값으로, 약 35%다. 즉 10장을 사도 셋 중 한 명꼴로는 원하는 카드를 한 장도 못 받는다. 90% 확률로 한 장이라도 받으려면 22장 정도가 필요하다.',
 '10명을 모두 모으는 건 더 어렵다. 이미 가진 카드가 늘어날수록 새 카드가 나올 확률이 줄어들기 때문이다. 이론상 평균 29장 정도를 사야 10종이 다 모인다. ‘10분의 1이니까 10번이면 된다’는 생각은 확률을 ‘정해진 횟수’처럼 착각한 것이다.'],
items:[
 {id:'r6-1',type:'mc',ab:'lit',kind:'정보 처리',q:'윗글에 따르면, 10장을 샀을 때 원하는 카드를 한 장도 못 받을 확률은?',opts:['0%','약 10%','약 35%','약 65%'],ans:2,exp:'2문단: 10분의 9를 열 번 곱하면 약 35%. 65%는 ‘한 장 이상 받을’ 확률이라 헷갈리기 쉬워요.'},
 {id:'r6-2',type:'mc',ab:'voc',kind:'어휘',q:'‘무작위로 한 장 들어 있다’에서 ‘무작위로’와 뜻이 가장 가까운 것은?',opts:['순서대로','원하는 대로','많이 팔린 순서로','정해진 규칙 없이'],ans:3,exp:'무작위(無作爲)는 ‘일부러 정하지 않음’, 즉 규칙 없이 아무것이나 고르는 거예요.'},
 {id:'r6-3',type:'mc',ab:'inf',bonus:true,kind:'추론',q:'같은 조건에서 한 장을 더 사서 11장이 됐다. 원하는 카드를 한 장도 못 받을 확률은?',opts:['0%가 된다','35%보다 조금 낮아진다','35%보다 높아진다','변하지 않는다'],ans:1,exp:'10분의 9를 한 번 더 곱하니 조금 줄어요(약 31%). 하지만 0%는 절대 안 돼요. 몇 장을 사도 ‘한 번도 안 나올’ 확률은 남아요.'},
 {id:'r6-4',type:'mc',ab:'cri',bonus:true,kind:'비판적 사고',q:'친구가 “20장 샀는데 원하는 카드가 한 장도 안 나왔어. 확률 조작이야!”라고 했다. 윗글을 바탕으로 가장 알맞은 반응은?',opts:['10분의 1이면 20장에서 반드시 2장은 나와야 하니 조작이 맞다.','20장에서 한 장도 안 나올 확률도 10%가 넘으니, 이것만으로 조작이라 단정하기는 어렵다.','확률은 계산할 수 없으니 아무도 알 수 없다.','20장은 원래 너무 적어서 한 장도 안 나오는 게 정상이다.'],ans:1,exp:'10분의 9를 스무 번 곱하면 약 12%. 열 명 중 한 명꼴로 생길 수 있는 일이라 조작의 증거로는 약해요. ①은 3문단이 말한 바로 그 착각이에요.'}

READS.push({id:'r7',title:'쇼츠는 왜 멈추기 힘들까',tag:'심리',body:[
 '자기 전에 ‘딱 한 개만’ 보려고 쇼츠를 켰는데, 정신을 차려 보니 한 시간이 지나 있다. 의지가 약해서일까? 사실 여기에는 우리 뇌가 보상에 반응하는 방식이 숨어 있다.',
 '심리학자들은 동물 실험에서 흥미로운 사실을 발견했다. 레버를 누를 때마다 먹이가 나오는 경우보다, 언제 나올지 모르게 가끔씩 나오는 경우에 동물이 레버를 훨씬 더 끈질기게 눌렀다. ‘다음 한 번에 나올지도 모른다’는 기대가 행동을 멈추지 못하게 만든 것이다. 이런 방식을 ‘가변 보상’이라고 한다.',
 '짧은 영상 앱도 비슷하다. 다음 영상이 재미있을지 없을지는 넘겨 봐야 안다. 게다가 영상이 끝없이 이어져서, 책의 마지막 장처럼 ‘여기서 멈추라’는 신호가 없다. 그래서 멈추고 싶다면 의지에만 기대기보다, 타이머를 맞추거나 앱을 첫 화면에서 치우는 식으로 멈출 지점을 직접 만들어 두는 것이 도움이 될 수 있다.'],
items:[
 {id:'r7-1',type:'mc',ab:'lit',kind:'내용 이해',q:'윗글의 동물 실험에 대한 설명으로 알맞은 것은?',opts:['먹이가 매번 나올 때 레버를 가장 많이 눌렀다.','먹이의 양이 많을수록 레버를 더 많이 눌렀다.','먹이가 안 나오면 바로 레버 누르기를 멈췄다.','먹이가 언제 나올지 모를 때 레버를 더 끈질기게 눌렀다.'],ans:3,exp:'2문단 둘째 문장이 핵심이에요. ‘매번’보다 ‘언제 나올지 모르게 가끔씩’일 때 더 끈질겼어요. 먹이의 양은 글에 나오지 않아요.'},
 {id:'r7-2',type:'mc',ab:'voc',kind:'어휘',q:'‘레버를 끈질기게 눌렀다’에서 ‘끈질기게’의 뜻은?',opts:['쉽게 포기하지 않고 계속','아주 가끔','조심스럽게','빠르고 정확하게'],ans:0,exp:'‘끈질기다’는 끈기 있게 오래 버틴다는 뜻이에요. “끈질기게 연습했다”처럼 써요.'},
 {id:'r7-3',type:'mc',ab:'inf',bonus:true,kind:'추론',q:'‘가변 보상’의 원리가 가장 잘 드러난 예는?',opts:['월요일마다 같은 용돈을 받는다.','숙제를 하면 항상 칭찬 스티커를 받는다.','뽑기 기계에서 가끔 원하는 인형이 나와서 계속 돈을 넣는다.','시험 점수가 오르면 정해진 선물을 받는다.'],ans:2,exp:'보상이 ‘언제 나올지 모르게 가끔’ 나오는 건 뽑기뿐이에요. 나머지는 언제, 무엇을 받는지 정해진 보상이에요.'},
 {id:'r7-4',type:'mc',ab:'cri',bonus:true,kind:'비판적 사고',q:'3문단에서 글쓴이가 ‘책의 마지막 장’을 예로 든 이유는?',opts:['책이 영상보다 재미있다는 것을 보여 주려고','끝이 있는 매체에는 자연스럽게 멈추는 지점이 있다는 것을 보여 주려고','책을 더 많이 읽으라고 권하려고','영상 앱이 책을 따라 만들었다고 말하려고'],ans:1,exp:'‘여기서 멈추라는 신호가 없다’를 설명하려고, 신호가 있는 책과 비교한 거예요. 그래서 마지막 문장에서 멈출 지점을 ‘직접 만들라’고 해요.'}

READS.push({id:'r8',title:'단톡 공지는 왜 아무도 안 할까',tag:'심리',body:[

READS.push({id:'r9',title:'줄 서는 맛집은 진짜 맛있을까',tag:'경제',body:[

items:[

    q:'오해가 생긴 가장 큰 이유는?',opts:['지수가 모임 날짜를 착각했다.','‘괜찮아’가 ‘사 와도 좋아(수락)’로도, ‘안 사 와도 돼(거절)’로도 읽히는 말이었다.','서준이 답장을 늦게 했다.','지수가 간식 사는 걸 귀찮아했다.'],ans:1,exp:'‘괜찮아’는 “그거 좋아”라는 수락으로도, “안 해도 돼”라는 거절로도 쓰여요. 제안에 답할 땐 “응, 사 와 줘!”나 “아냐, 안 사 와도 돼”처럼 뜻을 붙여야 오해가 없어요.'},
   {id:'t4',type:'mc',ab:'lit',kind:'반 단톡 · 체험학습',ctx:'<div class="ctx"><p><span class="tag hl">공지</span> <b>현장 체험학습 안내</b><br>· 11월 27일(목) <b>오전 8시 40분</b> 학교 정문 집합 (8시 50분 버스 출발)<br>· 준비물: 도시락, 물, 편한 운동화<br>· 급식은 제공되지 않습니다.<br>· 우천 시: <b>일정 그대로 진행</b> (실내 견학으로 변경)</p></div><div class="ctx" style="margin-top:8px">'+chat([['은채','l','비 오면 취소지? 예보에 비 온다던데 개꿀'],['태민','l','8시 50분까지만 가면 되지?'],['하람','r','도시락 싸 와야 하는 거 맞지?']])+'</div>',
    q:'안내문을 잘못 이해한 사람을 모두 고르면?',opts:['은채','은채, 태민','태민, 하람','셋 다'],ans:1,exp:'비가 와도 일정은 그대로예요(은채 ✕). 8시 50분은 버스 출발 시간이고 집합은 8시 40분이에요(태민 ✕). 급식이 없으니 도시락은 맞아요(하람 ○).'}]},
  {name:'‘아무거나’의 함정',items:[
   {id:'t5',type:'mc',ab:'cri',kind:'커플 대화 · 저녁 메뉴',ctx:'<div class="ctx">'+chat([['도윤','l','저녁 뭐 먹을래?'],['하나','r','아무거나 ㅎㅎ'],['도윤','l','그럼 떡볶이?'],['하나','r','어제 먹었잖아'],['도윤','l','돈가스는?'],['하나','r','느끼해'],['도윤','l','그럼 뭐 먹고 싶은데…'],['하나','r','아무거나 괜찮다니까?'],['sys','20분째 메뉴 못 정하는 중']])+'</div>',
    q:'이 대화가 꼬인 가장 큰 이유는?',opts:['도윤이 메뉴를 너무 적게 제안했다.','하나가 ‘아무거나’라고 했지만, 말하지 않은 조건(어제 먹은 것·느끼한 것 빼고)이 있었다.','둘 다 배가 고프지 않았다.','떡볶이와 돈가스가 너무 비쌌다.'],ans:1,exp:'‘아무거나’는 말 그대로가 아니라 “싫은 것만 빼고”일 때가 많아요. 듣는 사람은 숨은 조건을 알 수 없으니, 조건을 먼저 말하거나(“어제 분식 먹었으니 다른 거!”) 후보 2~3개 중에 고르게 하면 20분이 2분이 돼요.'}]}
 ],
 'case-persuade':[
  {name:'선생님과 조원 설득',items:[
   {id:'p3',type:'mc',ab:'cri',kind:'선생님 설득 · 마감 연장',ctx:'<div class="ctx"><p><b>상황</b> 독감으로 사흘 결석해서 금요일 마감인 수행평가 보고서를 다 못 썼다. 선생님께 마감을 늦춰 달라고 부탁해야 한다.</p></div>',
    q:'선생님을 설득할 가능성이 가장 높은 말은?',opts:['다른 반은 마감이 다음 주라던데 저희 반도 미뤄 주세요.','독감으로 사흘 결석해 자료 조사를 못 했습니다. 진단서는 내일 드릴게요. 다음 주 화요일까지 내도 될까요? 지금까지 쓴 부분은 오늘 먼저 내겠습니다.','아파서 못 했어요. 그냥 좀 봐주세요.','마감을 미뤄 주시면 다음부터 진짜 열심히 할게요.'],ans:1,exp:'선생님은 ‘공정한가’, ‘정말 사정이 있나’를 걱정해요. ②는 이유와 증거(진단서), 구체적인 날짜, 지금까지 한 부분까지 내밀어 걱정에 하나씩 답해요.'},
   {id:'p4',type:'mc',ab:'cri',kind:'조별 과제 설득',ctx:'<div class="ctx"><p><b>상황</b> 조별 발표가 다음 주 금요일이다. 자료 조사를 맡은 친구가 두 번이나 약속을 못 지켰다. 조장인 내가 메시지를 보내야 한다.</p></div>',
    q:'친구가 실제로 움직일 가능성이 가장 높은 메시지는?',opts:['너 때문에 우리 조 망하게 생겼어.','(조 단톡에) ○○ 빼고 다 했습니다~','네가 맡은 자료 조사가 목요일까지 필요해. 혹시 막히는 부분 있으면 같이 찾아볼까? 시간이 정말 안 되면 발표 부분이랑 바꿔도 돼.','선생님께 말씀드려서 네 점수만 깎아 달라고 할게.'],ans:2,exp:'비난하거나 공개적으로 망신을 주면 마음이 닫혀요. ③은 마감을 분명히 하면서 도움과 대안까지 줘서, 친구가 ‘할 수 있는 방법’을 고를 수 있게 해요.'}]},
  {name:'100일 대참사',items:[
   {id:'p5',type:'mc',ab:'cri',kind:'커플 싸움 · 100일',ctx:'<div class="ctx"><p><b>상황</b> 오늘이 서아와 사귄 지 100일인데 까맣게 잊었다. 밤 11시, 서아에게서 카톡이 왔다. <b>“오늘 무슨 날인지 몰라?”</b></p></div>',
    q:'서아의 마음을 풀 가능성이 가장 높은 답장은?',opts:['미안 ㅠ 근데 나 요즘 시험 때문에 진짜 바빴잖아.','100일 까먹은 거 진짜 미안해. 하루 종일 기다렸을 거 생각하니까 더 미안하다. 이번 토요일에 우리 처음 만난 카페 가자, 내가 다 준비할게.','100일이 그렇게 중요해? 매일 잘하면 되는 거지.','미안 미안 ㅋㅋ 선물 뭐 갖고 싶어?'],ans:1,exp:'화난 사람이 듣고 싶은 건 변명이 아니라 ① 잘못을 정확히 인정하고 ② 내 마음을 알아주고 ③ 어떻게 하겠다는 약속이에요. ②번만 셋을 다 담았어요. ①은 변명, ③은 상대 마음을 깎아내리고, ④는 웃으며 넘기려는 말로 읽혀요.'}]}
 ],
 'case-exam':[
  {name:'모두 고르기와 단위',items:[
   {id:'e3',type:'mc',ab:'cri',kind:'사회 시험지',ctx:'<div class="exam"><p><b>7.</b> 우리나라 국회의 권한으로 옳은 것을 &lt;보기&gt;에서 <b>모두</b> 고른 것은?<br>ㄱ. 법률을 만든다.<br>ㄴ. 대법원장을 임명한다.<br>ㄷ. 정부의 예산안을 심의·확정한다.<br>① ㄱ　② ㄴ　③ ㄱ, ㄷ　④ ㄴ, ㄷ</p><p>학생의 시험지: ㄱ에 동그라미, ㄷ 옆에 ‘?’ 표시<br>학생의 답: ① <span class="stamp">✕</span></p></div>',
    q:'이 학생이 틀린 가장 큰 이유는?',opts:['국회가 무엇인지 전혀 몰랐다.','‘모두’ 고르라는 문제인데 확실한 ㄱ만 고르고 ㄷ을 끝까지 확인하지 않았다.','ㄴ을 국회의 권한으로 착각했다.','보기의 개수를 잘못 셌다.'],ans:1,exp:'ㄷ에 ‘?’를 쳐 놓고 넘어갔어요. ‘모두 고른 것’은 하나만 맞아서는 안 되고 나머지도 하나씩 확인해야 해요. 국회는 법률 제정과 예산안 심의·확정을 해요(대법원장은 국회 동의를 얻어 대통령이 임명).'},
   {id:'e4',type:'mc',ab:'cri',kind:'과학 시험지',ctx:'<div class="exam"><p><b>4.</b> 시속 60km로 달리는 버스가 30km를 가는 데 걸리는 시간은 몇 <b>분</b>인가?</p><p>학생의 풀이: 30 ÷ 60 = 0.5<br>학생의 답: 0.5 <span class="stamp">✕</span></p></div>',
    q:'학생이 틀린 이유는?',opts:['나눗셈을 거꾸로 했다.','계산은 맞았지만 답을 ‘시간’ 단위로 쓰고 ‘분’으로 바꾸지 않았다.','속력 공식을 몰랐다.','문제의 숫자를 잘못 옮겼다.'],ans:1,exp:'30 ÷ 60 = 0.5는 0.5‘시간’이에요. 문제는 ‘몇 분’을 물었으니 30분이라고 써야 해요. 발문의 단위에 밑줄을 긋는 습관이 이런 실수를 막아요.'}]},
  {name:'6÷2(1+2) 논쟁',items:[
   {id:'e5',type:'mc',ab:'cri',kind:'단톡방 수학 논쟁',ctx:'<div class="exam"><p><b>단톡방에 올라온 문제</b><br><span style="font-size:22px;font-weight:800">6 ÷ 2(1 + 2) = ?</span></p><p>지민: “당연히 1이지. 2(1+2)를 한 덩어리로 먼저 계산해야지.”<br>서윤: “무슨 소리야, 앞에서부터 차례로 하면 9잖아.”</p><p class="tiny muted">…댓글 200개째 싸우는 중</p></div>',
    q:'이 싸움이 끝나지 않는 진짜 이유는?',opts:['지민이 곱셈을 잘못했다.','서윤이 괄호를 무시했다.','식이 애매하게 쓰여서, 생략된 곱셈 기호를 어떻게 읽느냐에 따라 답이 갈린다.','둘 다 계산을 틀렸다.'],ans:2,exp:'괄호 안(1+2=3)까지는 같아요. 갈리는 건 곱셈 기호가 생략된 2(3)을 한 덩어리로 보느냐(6÷6=1), 보통 배우는 대로 앞에서부터 계산하느냐(3×3=9)예요. 학교에서 배우는 규칙을 따르면 9지만, 애초에 두 가지로 읽히게 쓴 식이 문제예요. (6÷2)×(1+2)처럼 괄호 하나면 싸움 끝!'}]}
 ],
 'pz-order':[{name:'생활 속 문장 퍼즐',items:[
  {id:'o4',type:'order',ab:'inf',kind:'문장 퍼즐',title:'편의점 1+1의 비밀',parts:['편의점에서 1+1 행사를 보면 왠지 이득을 본 기분이 든다.','하지만 원래 하나만 필요했다면 이야기가 달라진다.','필요 없던 하나까지 사느라 돈을 더 쓴 셈이기 때문이다.','그래서 행사 상품 앞에서는 ‘원래 살 생각이었나?’부터 따져 보는 게 좋다.'],exp:'첫인상 → ‘하지만’으로 뒤집기 → ‘때문이다’로 이유 → ‘그래서’로 결론.'},
  {id:'o5',type:'order',ab:'inf',kind:'문장 퍼즐',title:'배터리가 빨리 닳는다면',parts:['휴대폰 배터리가 자꾸 빨리 닳는다면 화면부터 살펴보자.','화면은 배터리를 가장 많이 쓰는 부품 중 하나이기 때문이다.','따라서 화면 밝기를 조금만 낮춰도 쓸 수 있는 시간이 꽤 늘어난다.','여기에 쓰지 않는 앱의 위치 기능까지 끄면 효과는 더 커진다.'],exp:'제안 → ‘때문이다’로 이유 → ‘따라서’로 결과 → ‘여기에 ~까지’로 덧붙이기.'},
  {id:'o6',type:'order',ab:'inf',kind:'문장 퍼즐',title:'첫 문장이 중요한 이유',parts:['자기소개서를 읽는 사람은 하루에도 수십 편의 글을 읽는다.','그래서 첫 문장에서 흥미를 잃으면 나머지는 대충 넘기기 쉽다.','반대로 첫 문장이 구체적이면 끝까지 읽고 싶어진다.','결국 좋은 글은 첫 문장에서 이미 절반쯤 결정되는 셈이다.'],exp:'상황 → ‘그래서’ 결과 → ‘반대로’ 다른 경우 → ‘결국’ 정리.'}]}],
 'pz-word':[{name:'안내문·헷갈리는 말',items:[
  {id:'m3',type:'match',ab:'voc',kind:'단어 퍼즐',title:'안내문에 나오는 한자어',pairs:[['기한','미리 정해 둔 때'],['소정','정해진 바'],['일체','모든 것'],['상기','위에 적은 것']],exp:'‘소정의 상품’은 정해진 상품, ‘상기 내용’은 위에 적은 내용이에요. ‘일체’는 모든 것, ‘일절’은 전혀!'},
  {id:'m4',type:'match',ab:'voc',kind:'단어 퍼즐',title:'한 글자 차이, 다른 뜻',pairs:[['개발','새로 만들어 냄'],['계발','재능을 일깨워 줌'],['지양','하지 않도록 피함'],['지향','목표로 뜻이 향함']],exp:'‘자기 계발’, ‘신제품 개발’. ‘경쟁을 지양하고 협력을 지향한다’처럼 반대로 쓰여요.'}]}],
 'pz-gram':[{name:'자주 틀리는 맞춤법 2',items:[
  {id:'g6',type:'mc',ab:'voc',kind:'문법 퍼즐',shuf:true,q:'___에 친구를 만났다.',opts:['오랜만','오랫만'],ans:0,exp:'‘오래간만’이 줄어든 말이라 ‘오랜만’이에요.'},
  {id:'g7',type:'mc',ab:'voc',kind:'문법 퍼즐',shuf:true,q:'그 말을 듣고 너무 ___.',opts:['어이없었다','어의없었다'],ans:0,exp:'‘어이없다’가 표준어예요. ‘어의(御醫)’는 임금을 치료하던 의사라 뜻이 전혀 달라요.'},
  {id:'g8',type:'mc',ab:'voc',kind:'문법 퍼즐',shuf:true,q:'시험이 ___ 남았지?',opts:['며칠','몇일'],ans:0,exp:'‘몇일’은 없는 말이에요. 언제나 ‘며칠’.'},
  {id:'g9',type:'mc',ab:'voc',kind:'문법 퍼즐',shuf:true,q:'밥 먹고 ___는 내가 할게.',opts:['설거지','설겆이'],ans:0,exp:'표준어는 ‘설거지’예요.'},
  {id:'g10',type:'mc',ab:'voc',kind:'문법 퍼즐',shuf:true,q:'___ 그런 건 아니야.',opts:['일부러','일부로'],ans:0,exp:'‘일부러’가 맞아요. ‘일부로’는 ‘일부(一部)+로’, 즉 ‘한 부분으로’라는 뜻이 돼요.'}]}],
 'pz-blank':[{name:'흐름 읽기 2',items:[

   q:'엄마가 말한 “알아서 해.”의 뜻으로 가장 가까운 것은?',opts:['마음대로 해도 된다는 진짜 허락이다.','허락하고 싶지 않지만, 결정과 책임을 너에게 넘긴다는 말이다.','지민이네 집에 가는 길을 알아서 찾아가라는 말이다.','엄마는 이 일에 전혀 관심이 없다.'],ans:1,exp:'엄마는 앞에서 시험 걱정에 지난번 일까지 꺼내며 계속 반대 이유를 말했어요. 이런 흐름 뒤의 ‘알아서 해’는 허락보다 ‘나는 반대지만 네가 판단해’에 가까워요. 팁: 한마디보다 앞의 흐름을 읽고, 애매하면 “공부 몇 시간 하고 가면 괜찮아?”처럼 조건을 물어보세요.'}]}

EP['case-persuade'].push(
 {name:'친구 사이',items:[
  {id:'p6',type:'mc',ab:'cri',kind:'친구 설득 · 흑역사 사진',ctx:'<div class="ctx"><p><b>상황</b> 친구 준서가 반 단톡방(32명)에 내 중학교 때 흑역사 사진을 올렸다. 벌써 웃는 이모티콘이 줄줄이 달리는 중. 준서는 그냥 장난이라고 생각하는 것 같다.</p></div>',
   q:'사진을 내리게 할 가능성이 가장 높은 방법은?',opts:['(단톡에) 야 준서 너 진짜 선 넘었다. 당장 내려.','(단톡에) ㅋㅋㅋ 그럼 나도 너 사진 올린다?','(준서에게 개인톡) 장난인 거 알아. 근데 반 애들 다 보는 데라 나는 좀 많이 창피해. 지금 내려 줄 수 있어?','(아무 말 없이) 단톡방을 나간다.'],ans:2,exp:'단톡에서 따지면 준서도 32명 앞에서 체면이 걸려 버티기 쉽고, 보복은 싸움만 키워요. ③은 개인톡으로 준서의 체면을 지켜 주고, ‘장난인 거 안다’로 마음을 인정한 뒤, 내 감정과 원하는 행동(지금 내려 줘)을 분명히 말해요.'},
  {id:'p7',type:'mc',ab:'cri',kind:'친구 설득 · 빌려준 돈',ctx:'<div class="ctx"><p><b>상황</b> 한 달 전 친구 다은이에게 15,000원을 빌려줬다. 다은이는 아직 아무 말이 없고, 나는 다음 주에 그 돈이 필요하다. 사이가 어색해지는 건 싫다.</p></div>',
   q:'돈도 받고 사이도 지킬 가능성이 가장 높은 메시지는?',opts:['다은아 저번에 빌린 거 기억나? 나 다음 주 토요일에 쓸 일이 생겨서, 금요일까지 보내 줄 수 있어? 한 번에 어려우면 나눠서 줘도 돼!','야 돈 언제 줘? 한 달 지났다.','아니 돈은 괜찮은데… 그냥 생각나서 ㅎㅎ','(반 단톡에) 돈 빌리고 안 갚는 사람 진짜 별로다'],ans:0,exp:'다은이 쪽의 걱정은 ‘민망함’과 ‘지금 돈이 없을 수도 있음’이에요. ①은 부드럽게 꺼내고, 이유와 날짜를 분명히 하고, 나눠 갚는 길까지 열어 줘요. ③처럼 돌려 말하면 ‘안 줘도 된다’로 읽혀요.'}]},
 {name:'부모님 협상',items:[
  {id:'p8',type:'mc',ab:'cri',kind:'부모님 설득 · 통금 연장',ctx:'<div class="ctx"><p><b>상황</b> 통금은 밤 9시. 금요일에 친구들과 보는 영화가 9시 20분에 끝난다. 부모님은 “늦게 다니는 게 버릇 될까 봐, 그리고 밤길이 걱정돼서” 망설이신다.</p></div>',
   q:'부모님을 설득할 가능성이 가장 높은 말은?',opts:['친구들은 다 11시까지 놀아요. 저만 9시예요.','영화가 9시 20분에 끝나서 이번만 10시까지 들어올게요. 끝나면 바로 지하철 타고, 위치 공유도 켜 둘게요. 다음 주부턴 다시 9시 지킬게요.','저도 이제 고등학생이라 알아서 할 수 있어요.','그럼 영화 중간에 나올게요. 그러면 되죠?'],ans:1,exp:'부모님 걱정은 ‘버릇’과 ‘안전’ 두 가지예요. ②는 늦는 이유와 시간을 정확히 말하고(9시 20분 → 10시), 안전 대책(지하철·위치 공유)과 ‘이번만’이라는 약속으로 두 걱정에 모두 답해요.'},
  {id:'p9',type:'mc',ab:'cri',kind:'부모님 설득 · 학원 끊기',ctx:'<div class="ctx"><p><b>상황</b> 다니는 수학 학원이 진도만 빠르고 나한테 안 맞는다. 혼자 공부해 보고 싶은데, 부모님은 “학원 끊으면 성적 떨어질까 봐” 걱정하신다.</p></div>',
   q:'부모님을 설득할 가능성이 가장 높은 말은?',opts:['학원 진짜 재미없어요. 다니기 싫어요.','제 친구 민수도 학원 끊었는데 성적 올랐대요.','학원비 아낀 돈으로 용돈 올려 주시면 더 열심히 할게요.','한 달만 혼자 해 볼게요. 매일 저녁 8시~10시에 인강이랑 문제집 풀고, 주말마다 푼 거 보여 드릴게요. 다음 시험에서 점수 떨어지면 다시 다닐게요.'],ans:3,exp:'부모님 걱정은 ‘성적’이에요. ④는 구체적인 계획, 확인 방법(주말마다 보여 드리기), 실패했을 때의 약속까지 담아 걱정에 하나씩 답해요. ②는 남의 경우라 근거가 약해요.'}]},
 {name:'알바 협상',items:[
  {id:'p10',type:'mc',ab:'cri',kind:'알바 설득 · 쉬는 날 바꾸기',ctx:'<div class="ctx"><p><b>상황</b> 편의점 알바 중이다. 다음 주 토요일에 가족 행사가 있어서 쉬어야 한다. 사장님은 주말에 일할 사람이 부족해 늘 고민이다.</p></div>',
   q:'사장님이 바로 허락할 가능성이 가장 높은 말은?',opts:['사장님, 다음 주 토요일은 못 나와요. 죄송해요.','다음 주 토요일에 가족 행사가 있어서요. 같이 일하는 지현이가 대신 나와 줄 수 있대요. 저는 그다음 주 일요일에 지현이 대신 나갈게요. 괜찮으실까요?','알바생도 쉴 권리가 있잖아요.','(당일 아침에) 사장님, 오늘 몸이 안 좋아서 못 갈 것 같아요.'],ans:1,exp:'사장님 걱정은 ‘그날 일할 사람’이에요. ②는 미리 말하고, 대신할 사람과 맞교대까지 정해 와서 사장님이 고민할 게 없게 만들어요. 권리를 앞세우거나(③) 당일에 말하면(④) 같은 부탁도 거절당하기 쉬워요.'}]}
);
EP['case-exam'].push(
 {name:'날짜 세기',items:[
  {id:'e6',type:'mc',ab:'cri',kind:'수학 시험지 · 3일째',ctx:'<div class="exam"><p><b>6.</b> 민지는 <b>월요일</b>부터 감기약을 먹기 시작했다. 약을 먹기 시작한 지 <b>3일째</b> 되는 날은 무슨 요일인가?</p><p>학생의 풀이: 월요일 + 3일 → 목요일<br>학생의 답: 목요일 <span class="stamp">✕</span></p></div>',
   q:'학생이 틀린 이유는?',opts:['요일 순서를 잘못 외웠다.','‘3일째’는 첫날을 포함해 세는데, ‘3일 뒤’처럼 첫날을 빼고 셌다.','감기약을 하루에 몇 번 먹는지 몰랐다.','문제에 오류가 있다.'],ans:1,exp:'‘○일째’는 첫날이 1일째예요. 월(1일째)·화(2일째)·수(3일째) → 수요일. 학생은 ‘3일 뒤’(목요일)로 셌어요. 팁: ‘째’가 붙으면 첫날 포함!'},
  {id:'e7',type:'mc',ab:'cri',kind:'수학 시험지 · 주말 제외',ctx:'<div class="exam"><p><b>9.</b> 봉사 동아리는 11월 3일(월)부터 <b>주말을 뺀</b> 10일 동안 등굣길 캠페인을 한다. 캠페인 마지막 날은 몇 월 며칠인가?</p><p>학생의 풀이: 3일부터 10일 → 3 + 9 = 12<br>학생의 답: 11월 12일 <span class="stamp">✕</span></p></div>',
   q:'학생이 틀린 이유는?',opts:['덧셈을 잘못했다.','첫날을 빼고 셌다.','‘주말을 뺀’이라는 조건을 놓치고 달력 날짜로 10일을 셌다.','11월이 며칠까지 있는지 몰랐다.'],ans:2,exp:'주말을 빼면 3~7일(5일), 10~14일(5일) → 마지막 날은 11월 14일(금)이에요. 학생은 첫날 포함(3+9)은 잘했지만 주말 조건을 놓쳤어요. 팁: 날짜 문제는 조건 단어(주말 제외·평일만·공휴일)에 밑줄!'}]},
 {name:'숫자 읽기',items:[
  {id:'e8',type:'mc',ab:'cri',kind:'사회 시험지 · %와 %p',ctx:'<div class="exam"><p><b>3.</b> 우리 학교 급식 만족도가 작년 30%에서 올해 33%가 되었다. 이 변화를 바르게 나타낸 것은?<br>① 3% 증가　② 3%p 증가　③ 33% 증가　④ 10%p 증가</p><p>학생의 답: ① <span class="stamp">✕</span></p></div>',
   q:'학생이 틀린 이유는?',opts:['33에서 30을 잘못 뺐다.','만족도가 줄어든 것으로 착각했다.','④를 고르려다 실수로 ①을 칠했다.','비율끼리의 차이(%p)와 처음 값에 대한 증가율(%)을 구분하지 않았다.'],ans:3,exp:'30%→33%는 비율끼리 뺀 차이라 3%p(퍼센트포인트) 늘어난 거예요. ‘%’로 말하려면 30의 몇 %가 늘었는지 봐야 해서 3÷30 = 10% 증가. 그래서 ‘3% 증가’는 틀린 말이에요. 팁: 비율이 바뀐 걸 말할 땐 %p!'},
  {id:'e9',type:'mc',ab:'cri',kind:'수학 시험지 · 처음 가진 돈',ctx:'<div class="exam"><p><b>5.</b> 민수는 가진 돈의 절반으로 책을 사고, 남은 돈에서 2,000원을 간식비로 썼더니 3,000원이 남았다. 민수가 <b>처음</b> 가진 돈은 얼마인가?</p><p>학생의 풀이: 3,000 + 2,000 = 5,000<br>학생의 답: 5,000원 <span class="stamp">✕</span></p></div>',
   q:'학생이 틀린 이유는?',opts:['거꾸로 풀다가 ‘책을 사고 남은 돈’에서 멈추고, 묻는 ‘처음 가진 돈’까지 가지 않았다.','덧셈을 잘못했다.','간식비를 빼지 않았다.','절반을 3분의 1로 착각했다.'],ans:0,exp:'5,000원은 책을 사고 남은 돈이에요. 그게 처음 돈의 절반이니 처음 가진 돈은 10,000원. 팁: 답을 쓰기 전에 발문이 묻는 대상(처음·남은·모두)을 다시 확인!'}]},
 {name:'지문 밖 지식',items:[
  {id:'e10',type:'mc',ab:'cri',kind:'과학 시험지 · 꿀벌의 춤',ctx:'<div class="exam"><p><b>[지문]</b> 꿀벌은 꽃을 찾으면 벌집으로 돌아와 8자 모양으로 춤을 춘다. 춤의 방향은 꽃이 있는 쪽을, 춤을 추는 시간은 꽃까지의 거리를 알려 준다.</p><p><b>8.</b> 윗글을 통해 <b>알 수 있는</b> 것은?<br>① 꿀벌은 춤으로 꽃의 위치 정보를 전한다.<br>② 꿀벌은 꽃가루를 옮겨 식물이 열매 맺는 것을 돕는다.<br>③ 꿀벌의 춤은 꽃의 색깔을 알려 준다.<br>④ 꿀벌은 춤을 춘 뒤 꿀을 나눠 먹는다.</p><p>학생의 답: ② <span class="stamp">✕</span><br><span class="tiny muted">학생의 메모: “과학 시간에 배움! 맞는 말”</span></p></div>',
   q:'이 학생이 틀린 가장 큰 이유는?',opts:['②가 사실과 다른 내용이라서','‘8자 모양’을 잘못 읽어서','지문에 없는 내용을 배경지식으로 맞다고 판단해서','‘알 수 있는’을 ‘알 수 없는’으로 읽어서'],ans:2,exp:'②는 실제로 맞는 말이지만 지문에는 나오지 않아요. ‘윗글을 통해 알 수 있는 것’은 지문 안에 근거가 있어야 정답이에요. 정답은 ①. 팁: 선택지마다 “지문 어디에 있지?”를 짚어 보세요.'}]}
);
EP['pz-order'].push({name:'반전 있는 문장 퍼즐',items:[
 {id:'o7',type:'order',ab:'inf',kind:'문장 퍼즐',title:'시험 끝난 날의 반전',parts:['드디어 기말고사 마지막 과목인 과학 시험이 끝났다.','이번엔 진짜 잘 봤다는 생각에 나는 친구들과 답을 맞혀 보았다.','그런데 친구들이 말하는 답과 내 답이 하나씩 어긋나 있었다.','알고 보니 나는 3번부터 OMR 카드에 한 칸씩 밀려 적은 것이었다.'],exp:'‘드디어 끝났다’ → 답 맞혀 보기 → ‘그런데’로 이상한 점 → ‘알고 보니’로 원인 공개.'},

function ensureDay(){let ch=false;if(S.q.d!==gday()){S.q=freshQ();ch=true}const y=gday(Date.now()-864e5);if(S.last!==gday()&&S.last!==y&&S.streak>0){S.streak=0;ch=true}if(ch)save();return ch}

/* ============ 공통 동작 ============ */
let toastQ=[],toastOn=false;
function toast(t){toastQ.push(t);if(!toastOn)nextToast()}
function nextToast(){const t=toastQ.shift();if(!t){toastOn=false;return}toastOn=true;const el=$('#toast');el.textContent=t;el.classList.add('show');setTimeout(()=>{el.classList.remove('show');setTimeout(nextToast,220)},2000)}
function touch(){ensureDay();if(S.last!==gday()){const y=gday(Date.now()-864e5);S.streak=(S.last===y?S.streak:0)+1;S.last=gday();toast(`연속 학습 ${S.streak}일째!`)}}
function addXP(n){const b=lvOf(S.xp);S.xp+=n;const a=lvOf(S.xp);if(a>b){const rw=LV_REW.filter(r=>r.lv>b&&r.lv<=a).map(r=>r.l||('칭호 ‘'+r.v+'’'));toast(`레벨 업! Lv.${a}`+(rw.length?' · '+rw.join(', ')+' 획득':''))}}
function addTro(key,n){S.troSet[key]=(S.troSet[key]||0)+n}
function troField(f){return Object.entries(S.troSet).filter(([k])=>fieldOf(k)===f).reduce((a,[,v])=>a+v,0)}
function troTotal(){return Object.values(S.troSet).reduce((a,b)=>a+b,0)}
function completeQuest(k,label){ensureDay();if(!S.q[k]){S.q[k]=1;addXP(QXP[k]);toast(`퀘스트 완료: ${label} +${QXP[k]} XP`)}}
function checkAch(){ACH.forEach(a=>{if(a.locked||S.ach[a.id])return;const[c,t]=a.p();if(c>=t){S.ach[a.id]=gday();toast('업적 달성: '+a.t)}})}
const questDone=()=>S.q.feat&&S.q.quick&&S.q.word;
function pct(k){if(k==='spd')return S.spd.games?Math.min(100,Math.round(S.spd.best/20*100)):null;const a=S.ab[k];return a&&a.t?Math.round(a.c/a.t*100):null}
function weakest(){let w=null,v=999;Object.keys(AB).forEach(k=>{const p=pct(k);if(p!==null&&p<v){v=p;w=k}});return w}

/* ============ 리그 시뮬레이터 ============ */
/* 골드 I(인덱스 6)로 막 승급한 상태에서 시작. 점수 변동은 성과 기준이 정해지기 전까지 최대값 안에서 임시로 무작위 */
const SIM={i:6,p:20,sh:2,log:[]};
function sim(a){
  if(a==='r'){Object.assign(SIM,{i:6,p:20,sh:2,log:[]});return}
  if(a==='w'){
    const g=rand(15,45);SIM.p+=g;let msg=`승리 +${g}점`;
    if(SIM.p>=100){
      if(SIM.i<20){SIM.i++;SIM.p-=100;
        if(SIM.i%3===0){SIM.sh=2;msg+=` → ${tierName(SIM.i)} 승급! 보호막 2개 지급`}
        else msg+=` → ${tierName(SIM.i)} 승급`}
      else SIM.p=100}
    SIM.log.push(msg);return}
  const l=rand(10,30);
  if(SIM.p>0){const was=SIM.p;SIM.p=Math.max(0,SIM.p-l);SIM.log.push(`패배 −${Math.min(l,was)}점${SIM.p===0?' · 0점 도달':''}`);return}
  if(SIM.i===0){SIM.log.push('브론즈 I은 가장 낮은 티어라 더 내려가지 않아요');return}
  if(SIM.i%3!==0){SIM.i--;SIM.p=70;SIM.log.push(`0점에서 패배 → ${tierName(SIM.i)} 강등 (같은 티어 안이라 보호막은 쓰지 않아요)`);return}
  if(SIM.sh>0){SIM.sh--;SIM.log.push(`티어가 바뀌는 강등전 · 보호막이 대신 깨졌어요 (남은 보호막 ${SIM.sh}개)`);return}
  SIM.i--;SIM.p=70;SIM.sh=2;SIM.log.push(`보호막 없이 패배 → ${tierName(SIM.i)} 강등 · 새 티어라 보호막 2개 지급`);
}

/* ============ 시트(게임 화면) ============ */
let G=null;
const sheet=$('#sheet');
function openSheet(title){$('#shTitle').textContent=title;sheet.classList.add('open');$('#shBody').scrollTop=0}
function stopTimers(){if(G){if(G.timer){clearInterval(G.timer);G.timer=null}if(G.qt){clearInterval(G.qt);G.qt=null}}}
function closeSheet(){stopTimers();G=null;sheet.classList.remove('open');save();render()}
function prog(i,n){$('#shProg').innerHTML=`<div class="bar hlb"><i style="width:${n?i/n*100:0}%"></i></div>`}

function startSet(id,ids){
  stopTimers();
  let set;
  if(id==='note'){set={id:'note',title:'오답 다시 풀기',ids:ids}}
  else{set=SETS[id];if(set.gen){const items=GEN[set.gen]();reg(items,id);set.ids=items.map(x=>x.id)}}
  G={set,ids:set.ids.slice(),i:0,c:0,xp:0,tro:0,phase:set.intro?'intro':'q',fb:null,wrongN:0,timeouts:0};
  openSheet(set.title);
  if(G.phase==='q')goQ();else drawGame();
}
function goQ(){if(G.i===0&&!G.t0)G.t0=Date.now();prepItem();drawGame();startQTimer();$('#shBody').scrollTop=0}
function prepItem(){
  const it=IT[G.ids[G.i]];if(!it)return;
  G.fb=null;G.timedOut=false;G.bad=null;
  if(it.type==='mc'){if(it.shuf){const o=mcShuf(it.opts[it.ans],it.opts.filter((_,i)=>i!==it.ans));G.opts=o.opts;G.ans=o.ans}else{G.opts=it.opts;G.ans=it.ans}G.picked=null}
  if(it.type==='order'){G.pool=shuffle(it.parts.map((_,i)=>i));G.sel=[]}
  if(it.type==='match'){G.L=shuffle(it.pairs.map((_,i)=>i));G.R=shuffle(it.pairs.map((_,i)=>i));G.selL=null;G.done=[];G.miss=0}
}
/* 문제당 제한 시간: 오답 노트 다시 풀기에는 원래 모드의 제한 시간을 적용 */
function limitOf(it){return G.set.limit||(G.set.id==='note'&&SETS[it.setId]?SETS[it.setId].limit:0)||0}
function startQTimer(){
  if(G.qt){clearInterval(G.qt);G.qt=null}
  const it=IT[G.ids[G.i]];const lim=limitOf(it);
  if(!lim){prog(G.i,G.ids.length);return}
  G.tLim=lim;G.tEnd=Date.now()+lim*1000;G.qt=setInterval(qTick,100);qTick();
}
function qTick(){
  if(!G||G.fb||!G.tEnd){if(G&&G.qt){clearInterval(G.qt);G.qt=null}return}
  const left=Math.max(0,G.tEnd-Date.now());
  $('#shProg').innerHTML=`<div class="timer"><div class="bar" style="flex:1"><i style="width:${left/(G.tLim*10)}%;background:${left<3000?'var(--bad)':'var(--blue)'}"></i></div><b style="color:${left<3000?'var(--bad)':'var(--ink)'}">${Math.ceil(left/1000)}초</b></div>`;
  if(left<=0){clearInterval(G.qt);G.qt=null;onTimeout()}
}
function onTimeout(){
  const it=IT[G.ids[G.i]];
  G.timedOut=true;G.timeouts++;
  if(it.type==='mc')G.picked=-1;
  if(it.type==='match')G.selL=null;
  grade(false);drawGame();
}
function drawGame(){
  const body=$('#shBody'),foot=$('#shFoot');
  if(G.phase==='intro'){const r=G.set.intro;prog(0,G.ids.length);
    body.innerHTML=`<div class="kind"><span class="tag">${r.tag}</span><span class="tag">글 읽기</span></div><h2 class="h1" style="font-size:23px;margin-bottom:12px">${r.title}</h2><div class="passage">${r.body.map(p=>`<p>${p}</p>`).join('')}</div>`;
    foot.innerHTML=`<button class="btn full hl" data-act="beginQ">다 읽었어요 · 문제 풀기</button>`;return}
  if(G.phase==='done')return drawResult();
  const it=IT[G.ids[G.i]];
  if(G.fb||!limitOf(it))prog(G.i+(G.fb?1:0),G.ids.length);
  const lim=limitOf(it);
  let h=`<div class="kind"><span class="tag">${it.kind}</span><span class="tag">${AB[it.ab]}</span>${it.bonus?'<span class="tag hl">보너스 · 추가 점수</span>':''}${lim?`<span class="tag tm">${lim}초</span>`:''}<span class="spacer"></span><span class="tiny muted num">${G.i+1} / ${G.ids.length}</span></div>`;
  if(G.set.intro)h+=`<details class="pv"><summary>지문 다시 보기</summary><div class="passage">${G.set.intro.body.map(p=>`<p>${p}</p>`).join('')}</div></details>`;
  if(it.ctx)h+=it.ctx;
  if(it.type==='mc'){
    h+=`<div class="q">${fmtQ(it.q)}</div><div class="opts">`+G.opts.map((o,i)=>{let c='';if(G.picked!==null){if(i===G.ans)c='ok';else if(i===G.picked)c='no'}return`<button class="opt ${c}" data-act="pick" data-arg="${i}" ${G.picked!==null?'disabled':''}><span class="n">${i+1}</span><span>${o}</span></button>`}).join('')+'</div>';
  }
  if(it.type==='order'){
    h+=`<div class="q">${it.title}<br><span class="tiny muted" style="font-weight:500">문장을 이야기 순서대로 눌러 쌓아 보세요. 쌓은 문장을 누르면 빠져요.</span></div>`;
    h+=`<div class="slots">${G.sel.length?G.sel.map((pi,k)=>`<button class="piece" data-act="ordDel" data-arg="${k}" ${G.fb?'disabled':''}><b>${k+1}</b><span>${it.parts[pi]}</span></button>`).join(''):'<div class="empty">여기에 순서대로 쌓여요</div>'}</div>`;
    h+=`<div class="list">${G.pool.map(pi=>{const used=G.sel.includes(pi);return`<button class="piece ${used?'used':''}" data-act="ordAdd" data-arg="${pi}" ${used||G.fb?'disabled':''}><b>·</b><span>${it.parts[pi]}</span></button>`}).join('')}</div>`;
  }
  if(it.type==='match'){
    const off=!!G.fb;
    h+=`<div class="q">${it.title}<br><span class="tiny muted" style="font-weight:500">왼쪽 단어를 먼저 누르고, 알맞은 뜻을 누르세요. 실수 없이 맞히면 정답!</span></div>`;
    h+=`<div class="match"><div class="col">${G.L.map(i=>{const d=G.done.includes(i),bad=G.bad&&G.bad[0]===i;return`<button class="mbtn ${d?'done':''} ${G.selL===i?'sel':''} ${bad?'bad':''}" data-act="mL" data-arg="${i}" ${d||off?'disabled':''}>${it.pairs[i][0]}</button>`}).join('')}</div><div class="col">${G.R.map(i=>{const d=G.done.includes(i),bad=G.bad&&G.bad[1]===i;return`<button class="mbtn ${d?'done':''} ${bad?'bad':''}" data-act="mR" data-arg="${i}" ${d||off?'disabled':''}>${it.pairs[i][1]}</button>`}).join('')}</div></div>`;
    h+=`<div class="miss ${G.miss?'on':''}">${G.bad?'✕ 틀렸어요! ':''}실수 ${G.miss}번</div>`;
  }
  body.innerHTML=h;
  if(G.fb){
    let extra='';
    if(it.type==='order'&&!G.fb.ok)extra=`<p><b>정답 순서</b><br>${it.parts.map((p,i)=>`${i+1}. ${p}`).join('<br>')}</p>`;
    if(it.type==='match'&&!G.fb.ok)extra=`<p><b>정답</b><br>${it.pairs.map(p=>`${p[0]} — ${p[1]}`).join('<br>')}</p>`;
    const head=G.fb.ok?'정답!':G.timedOut?'시간 초과':(it.type==='match'?`실수 ${G.miss}번`:'아쉬워요');
    foot.innerHTML=`<div class="fb ${G.fb.ok?'ok':'no'}"><h3>${head}</h3>${G.fb.ok?`<p class="tiny">+${G.fb.xp} XP · 트로피 +${G.fb.t}</p>`:'<p class="tiny">오답 노트에 저장했어요</p>'}${extra}<p>${it.exp}</p></div><button class="btn full ${G.fb.ok?'hl':''}" data-act="next">${G.i+1<G.ids.length?'다음 문제':'결과 보기'}</button>`;
  }else if(it.type==='order'&&G.sel.length===it.parts.length){
    foot.innerHTML=`<button class="btn full hl" data-act="ordCheck">이 순서로 확인</button>`;
  }else foot.innerHTML='';
}
function grade(ok){
  if(G.qt){clearInterval(G.qt);G.qt=null}
  const it=IT[G.ids[G.i]];
  touch();
  if(!S.ab[it.ab])S.ab[it.ab]={c:0,t:0};
  S.ab[it.ab].t++;
  let xp=0,t=0;
  if(ok){S.ab[it.ab].c++;G.c++;xp=it.bonus?15:(it.type==='mc'?10:12);t=it.bonus?4:2;S.solved[it.id]=1;
    if(it.field==='case')S.st.caseOk++;
    if(G.set.id==='note')S.note=S.note.filter(x=>x!==it.id);
    addXP(xp);G.xp+=xp;addTro(it.setId,t);G.tro+=t;
  }else{G.wrongN++;S.wrong[it.id]=(S.wrong[it.id]||0)+1;if(!S.note.includes(it.id))S.note.push(it.id)}
  G.fb={ok,xp,t};
  checkAch();save();
}
function finishSet(){
  G.phase='done';stopTimers();S.m.done=(S.m.done||0)+1;
  const sid=G.set.id;track('done-'+sid);S.played=S.played||{};if(sid!=='note')S.played[sid]=1;
  if(sid.startsWith('read-'))S.st.reads++;
  if(sid==='test-word'&&G.c===G.ids.length)S.st.wordPerfect=true;
  if(modeOf(sid)===feat())completeQuest('feat','오늘의 콘텐츠');
  G.secs=Math.max(1,Math.round((Date.now()-(G.t0||Date.now()))/1000));
  if(G.duel&&G.duel.recv){const o=G.duel.recv;G.outcome=G.c>o.c||(G.c===o.c&&G.secs<o.secs)?'win':(G.c===o.c&&G.secs===o.secs?'draw':'lose');
    if(G.duel.retry){G.duel.second={c:G.c,secs:G.secs};if(G.outcome==='win')S.m.chRetryWin=(S.m.chRetryWin||0)+1}
    else{G.duel.first={c:G.c,secs:G.secs};S.m['ch'+{win:'Win',lose:'Lose',draw:'Draw'}[G.outcome]]++}}
  checkAch();save();drawGame();
}
function drawResult(){
  const n=G.ids.length;
  prog(n,n);
  const msg=G.c===n?'완벽해요!':G.c>=n/2?'좋아요, 거의 다 왔어요':'틀린 문제가 진짜 공부예요';
  const o=G.duel&&G.duel.recv;
  const d=G.duel||{};
  const duelHTML=o?`<div class="vsbox"><div><small>${esc(o.name)}</small><b>${o.c}/${o.n}</b><span>${o.secs}초</span></div><div class="vs">VS</div><div><small>나${d.retry?' · 재도전':''}</small><b>${G.c}/${n}</b><span>${G.secs}초</span></div></div><div class="h1 outcome ${G.outcome}">${{win:d.retry?'재도전 성공! 기록을 깼어요':'도전 성공! 기록을 깼어요',lose:'아깝다, 기록을 못 깼어요',draw:'완전 동점!'}[G.outcome]}</div>${d.retry&&d.first?`<p class="tiny muted" style="margin:0">첫 기록 ${d.first.c}/${n} · ${d.first.secs}초</p>`:'<p class="tiny muted" style="margin:0">맞힌 개수가 같으면 더 빨리 푼 사람이 이겨요.</p>'}
`:'';
  const canCh=!!CH_CODE[G.set.id];const gr=gradeOf(G.set.id,G.c,n,G.secs);
  const hint=!canCh?'':!o?(gr==='S'||gr==='A'?'이 기록이면 친구들 꽤 고생할걸요?':'친구는 몇 개나 맞힐까요? 같이 풀어 보자고 보내 보세요.'):G.outcome==='win'?'기록을 깼어요. 다음 상대를 고를 차례예요.':G.outcome==='lose'?(d.retry?'친구에게 복수를 맡겨 보세요.':'아깝다! 친구에게 도전장을 보내면 재도전 기회를 1번 더 줘요.'):(d.retry?'승부가 안 났어요. 다른 친구에게 판정을 맡겨 보세요.':'완전 동점! 친구에게 도전장을 보내면 재도전 기회를 1번 더 줘요.');
  const shareLabel=!o?'친구에게 도전장 보내기':G.outcome==='win'?'다음 상대에게 도전장 보내기':G.outcome==='lose'?'친구에게 복수 맡기기':'친구에게 판정 맡기기';
  const chHTML=canCh?`<div class="chshare">
    ${hint?`<p class="tiny" style="margin:0 0 8px;font-weight:700">${hint}</p>`:''}
    <div class="nickrow"><label for="nick3">보내는 이름</label><input class="inp" id="nick3" maxlength="10" value="${S.name==='체험생'?'':esc(S.name)}" placeholder="친구가 알아볼 닉네임" autocomplete="off"></div>
    <button class="btn full big-cta blue-glow" data-act="shareCh">⚔️ ${shareLabel}</button>
    ${o&&G.outcome!=='win'&&!d.retry?(d.unlocked?`<button class="btn full hl retry-on" style="margin-top:8px" data-act="retryCh">🎁 재도전 1회 열림! 같은 문제로 다시 도전</button>`:`<button class="btn full retry-lock" style="margin-top:8px" data-act="retryLocked">🔒 재도전 1회 · 도전장을 보내면 열려요</button>`):''}
    <div class="row" style="margin-top:10px"><button class="btn story-btn" style="flex:1.4" data-act="storyCh"><span class="story-ring"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></span>스토리에 올리기</button><button class="btn ghost" style="flex:1" data-act="makeCh">링크·코드 보기</button></div>
    <button class="btn full wait-btn" style="margin-top:10px" data-act="wait"><span class="wait-ic">${IC.bell}</span><span class="wait-tx"><b>정식 출시 알림 받기</b><small>대기자 한정 칭호 지급 · 1분 설문</small></span><span class="wait-go">›</span></button></div>`:'';
  $('#shBody').innerHTML=`<div class="result">${duelHTML}<div class="tiny muted">${esc(G.set.title)}</div><div class="big num" style="margin-top:8px">${canCh?gradeTag(gr,'lg')+' ':''}${G.c}<span style="font-size:28px" class="muted"> / ${n}</span></div><div class="h1" style="font-size:20px;margin-top:10px"><span class="mark">${msg}</span></div>${canCh?chainHTML(o||null,'나',{c:G.c,secs:G.secs},G.set.id):''}${chHTML}
  <button class="btn full topic-btn" data-act="topicSoon"><span class="topic-ic">🎯</span><span class="topic-tx"><b>다른 주제로도 겨뤄 볼래?</b><small>게임·스포츠·자동차 등 원하는 주제 고르기</small></span><span class="soon">준비 중</span></button>
  <div class="rew"><div><span class="tiny muted">얻은 경험치</span><b class="num">+${G.xp} XP</b></div><div><span class="tiny muted">얻은 트로피</span><b class="num">+${G.tro}</b></div></div>
  ${G.timeouts?`<p class="tiny" style="color:var(--bad)">시간 초과 ${G.timeouts}문제</p>`:''}
  ${G.wrongN?`<p class="tiny muted">틀린 ${G.wrongN}문제는 오답 노트에 저장했어요. 나 탭에서 다시 풀 수 있어요.</p>`:''}
  <p class="tiny muted">연속 학습 ${S.streak}일 · Lv.${lvOf(S.xp)}${CH_CODE[G.set.id]?` · 걸린 시간 ${G.secs}초`:''}</p>
</div>`;
  $('#shFoot').innerHTML=`<div class="row"><button class="btn ghost" style="flex:1" data-act="restart">다시 하기</button><button class="btn hl" style="flex:1" data-act="close">완료</button></div>`;
}

/* 1분 퀴즈 (1시간에 1번) */
function startQuick(){
  const left=quickLeft();
  if(left){toast(`1분 퀴즈는 1시간에 1번! 다음 도전까지 ${fmtLeft(left)}`);return}
  stopTimers();
  S.quickAt=Date.now();save();
  G={quick:1,pool:shuffle(QUICK),i:0,c:0,w:0,end:Date.now()+60000,lock:false,swap:false,done:false};
  openSheet('1분 퀴즈');drawQuick();G.timer=setInterval(tickQuick,100);
}
function drawQuick(){
  const q=G.pool[G.i%G.pool.length];G.swap=Math.random()<.5;
  const a=G.swap?[q[2],q[1]]:[q[1],q[2]];
  $('#shBody').innerHTML=`<div class="score num"><span style="color:var(--good)">정답 ${G.c}</span><span style="color:var(--bad)">오답 ${G.w}</span></div><div class="qbig">${fmtQ(q[0])}</div><div class="qopts"><button data-act="qa" data-arg="0">${a[0]}</button><button data-act="qa" data-arg="1">${a[1]}</button></div>`;
  $('#shFoot').innerHTML='';tickQuick();
}
function tickQuick(){
  if(!G||!G.quick||G.done)return;
  const left=Math.max(0,G.end-Date.now());
  $('#shProg').innerHTML=`<div class="timer"><div class="bar" style="flex:1"><i style="width:${left/600}%;background:${left<10000?'var(--bad)':'var(--blue)'}"></i></div><b>${Math.ceil(left/1000)}초</b></div>`;
  if(left<=0)finishQuick();
}
function quickAnswer(k,btn){
  if(G.lock||G.done)return;G.lock=true;
  const ok=(G.swap?1:0)===+k;
  if(ok)G.c++;else G.w++;
  btn.classList.add(ok?'ok':'no');
  setTimeout(()=>{if(!G||G.done||!G.quick)return;G.lock=false;G.i++;drawQuick()},220);
}
function finishQuick(){
  G.done=true;clearInterval(G.timer);G.timer=null;
  touch();
  const prevBest=S.spd.best;S.spd.games++;S.spd.best=Math.max(S.spd.best,G.c);
  const xp=5+G.c*2;addXP(xp);addTro('quick',G.c);
  completeQuest('quick','1분 퀴즈');
  checkAch();save();
  const acc=G.c+G.w?Math.round(G.c/(G.c+G.w)*100):0;
  $('#shBody').innerHTML=`<div class="result"><div class="tiny muted">1분 퀴즈 결과</div><div class="big num" style="margin-top:8px">${G.c}<span style="font-size:24px" class="muted">개 정답</span></div><div class="h1" style="font-size:20px;margin-top:10px"><span class="mark">${G.c>prevBest?'최고 기록 경신!':'최고 기록 '+S.spd.best+'개'}</span></div>
  <div class="rew"><div><span class="tiny muted">정확도</span><b class="num">${acc}%</b></div><div><span class="tiny muted">얻은 보상</span><b class="num">+${xp} XP</b></div></div>
  <p class="tiny muted">트로피 +${G.c} · 정보 처리 속도 점수에 반영됐어요.<br>다음 도전은 1시간 뒤에 열려요.</p></div>`;
  $('#shFoot').innerHTML=`<button class="btn hl full" data-act="close">완료</button>`;
}

async function shareCard(){

/* ============ 방문 집계 ============ */
/* GoatCounter: 쿠키·개인정보 없이 방문 수와 버튼 클릭 수만 셈. 주소 뒤 #도전장 코드(닉네임 포함)는 보내지 않고 경로만 보냄.
   GoatCounter 스크립트는 기본적으로 iframe(아티팩트 미리보기) 안과 localhost에서는 세지 않음 → GitHub Pages 방문만 집계됨 */
function gcInit(viaCh){
  if(!GC_CODE)return;
  window.goatcounter={no_onload:true};
  const sc=document.createElement('script');sc.async=true;sc.src='https://gc.zgo.at/count.js';
  sc.setAttribute('data-goatcounter',`https://${GC_CODE}.goatcounter.com/count`);
  sc.onload=()=>{try{window.goatcounter.count({path:location.pathname||'/'});if(viaCh)track('open-challenge')}catch(e){}};
  document.head.appendChild(sc);
}
function track(name){try{if(window.goatcounter&&window.goatcounter.count)window.goatcounter.count({path:name,title:name,event:true})}catch(e){}}
function topicModal(){

  ${TOPIC_URL?`<a class="btn full hl" style="text-decoration:none" href="${esc(TOPIC_URL)}" target="_blank" rel="noopener" onclick="track('topic-form')">어떤 주제가 좋은지 알려 주기</a>`:''}
  <button class="btn full ghost" style="margin-top:8px" data-act="mclose">닫기</button>`);
